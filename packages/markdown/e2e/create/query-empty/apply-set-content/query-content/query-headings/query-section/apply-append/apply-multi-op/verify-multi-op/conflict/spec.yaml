description: "Stale baseVersion triggers 409 Conflict (optimistic lock)"
steps:
  - type: exec
    command: >-
      curl -s -X POST http://localhost:8787/md-e2e-001/apply
      -H "Content-Type: application/json"
      -d '{"baseVersion":2,"description":"stale write","operations":[{"kind":"setContent","payload":{"content":"should fail"}}]}'
    assert:
      type: regex
      conditions:
        - { path: "stdout", regex: "Version conflict" }
        - { path: "stdout", regex: "\"success\":false" }
