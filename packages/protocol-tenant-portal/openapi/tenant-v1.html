<!doctype html>
<html lang="en">
<head>

  <title>UniDocs Tenant API</title>
  <style>
    html, body, #app { height: 100%; margin: 0; }
    body { background: #fff; }
    #locale-switch {
      position: fixed;
      top: 12px;
      right: 16px;
      z-index: 100;
      display: flex;
      gap: 2px;
      padding: 2px;
      border-radius: 8px;
      background: rgba(127, 127, 127, 0.16);
      font: 500 13px/1 ui-sans-serif, system-ui, sans-serif;
    }
    #locale-switch button {
      padding: 6px 12px;
      border: 0;
      border-radius: 6px;
      background: transparent;
      color: inherit;
      cursor: pointer;
      font: inherit;
    }
    #locale-switch button[aria-pressed="true"] {
      background: #fff;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.16);
    }
    @media (prefers-color-scheme: dark) {
      body { background: #0f0f0f; }
      #locale-switch button[aria-pressed="true"] {
        background: #2f2f2f;
        box-shadow: none;
      }
    }
  </style>
</head>

r` 时服务端只验这个 token，验证失败也不得回落到 cookie；Operator Agent 正是以此读取与用户相同的权威数据，使用 `documents:read`、`comments:read` 和 `cas:read` scope。用 cookie 鉴权的 mutation 额外要求 `X-CSRF-Token`，Bearer 鉴权则不需要。创建文档、thread 和 ping 要求 `Idempotency-Key`；移动 current 指针不要求，因为 `observedCurrentVersionIdx` 本身就是等值锁。\n\nPlatform 从不代理 UniCAS 的 node 流量。富文本正文、附件以及 snapshot 内的大块二进制都是 `CasBlobRef` / `SBlob` 引用，由调用方持短期 tenant capability 直接从 UniCAS 读取。"},"tags":[{"name":"文档类型","description":"已启用文档类型的目录，以及校验其 snapshot 与 location 的不可变配对 contract revision。"},{"name":"文档","description":"文档身份、current 版本指针，以及对该指针的受审计移动。创建文档会通知其 Operator，由 Operator 提交首个 snapshot。"},{"name":"版本","description":"按出生顺序排列的不可变版本。元数据同时承载两张图——base parent forest 与 comment provenance——snapshot 字节则逐个版本单独读取。"},{"name":"Thread","description":"位置锚定的讨论，持有只追加的用户 ping 序列和只追加的 Agent pong 序列。"},{"name":"审计","description":"不可变的文档级事件。移动 current 指针会改变后续版本与 submission 所依据的基线，因此必须审计。"},{"name":"CAS","description":"用于直接读写 UniCAS 内容的短期 tenant capability，字节不经过 Platform 中转。"}],"security":[{"tenantBearer":[]},{"tenantSession":[]}],"components":{"securitySchemes":{"tenantBearer":{"type":"http","scheme":"bearer","description":"Platform OAuth access token。只要存在就只走 Bearer 鉴权；token 无效时绝不回落到 session cookie。Agent 的 scope 为 `documents:read`、`cas:read`、`cas:lease`、`comments:read`、`comments:pong` 和 `versions:submit`；本 API 使用其中的读 scope，`versions:submit` 属于独立的 Agent submission API。"},"tenantSession":{"type":"apiKey","in":"cookie","name":"__Host-unidocs_tenant","description":"HttpOnly 同源最终用户 session cookie"},"tenantCsrf":{"type":"apiKey","in":"header","name":"X-CSRF-Token","description":"使用 session cookie 鉴权的 mutation 所需的 CSRF token"}}},"openapi":"3.1.1","paths":{"/api/v1/tenants/{tenantId}/document-types":{"get":{"operationId":"listPublicDocumentTypes","summary":"列出可创建的文档类型","description":"返回已启用文档类型的 cursor 分页目录。每一项都有当前 Type Card bundle、当前 View bundle，以及 View 与内建 Operator 共同支持的非空 contract revision 集合。Type Card 的资源路径已解析为 bundle origin 下的绝对 URL；调用方对 `typeCard.locales` 做 RFC 4647 lo       var locales = [{"code":"en","label":"English"},{"code":"zh","label":"简体中文"}];
      var storageKey = 'unidocs-tenant-api-locale';
      var current = null;

      function stored() {
        try {
          return window.localStorage.getItem(storageKey);
        } catch (error) {
          return null;
        }
      }

      function remember(code) {
        try {
          window.localStorage.setItem(storageKey, code);
        } catch (error) {
          // A reader with site data blocked still gets a working switch.
        }
      }

      function render(code) {
        if (code === current) return;
        current = code;
        document.documentElement.lang = code;
        document.getElementById('app').innerHTML = '';
        Scalar.createApiReference('#app', {
          content: documents[code],
          layout: 'modern',
          theme: 'default',
          // Scalar's modern layout collapses every tag but the first, and its
          // "Show more" button hard-codes open:true, so an expanded tag can
          // never be collapsed again. Opening every tag up front means that
          // one-way control is never rendered. Individual operations stay
          // collapsible either way. The option's performance warning is about
          // large documents; this one has 15 operations.
          defaultOpenAllTags: true,
          authentication: { preferredSecurityScheme: 'tenantSession' },
          pageTitle: 'UniDocs Tenant API'
        });
        Array.prototype.forEach.call(
          document.querySelectorAll('#locale-switch button'),
          function (button) {
            button.setAttribute('aria-pressed', String(button.dataset.locale === code));
          }
        );
      }

      var nav = document.getElementById('locale-switch');
      locales.forEach(function (locale) {
        var button = document.createElement('button');
        button.type = 'button';
        button.textContent = locale.label;
        button.dataset.locale = locale.code;
        button.addEventListener('click', function () {
          remember(locale.code);
          render(locale.code);
        });
        nav.appendChild(button);
      });

      var initial = stored();
      render(documents[initial] ? initial : locales[0].code);
    })();
  </script>
