name = "unidocs-docx"
main = "dist/worker.js"
compatibility_date = "2025-08-17"

# Stack mode: the editor DO routes canonical /stacks/{stackId}/tenants/...
# to the middleware worker; the delegated CAS capability is verified against
# the registered stack issuer — either by RFC 8414 discovery of the issuer's
# jwks_uri (HTTPS issuer) or the pinned CAS_STACK_TRUSTED_JWKS snapshot
# (non-URL dev issuers).
#
# CAS_STACK_ISSUER / CAS_CAPABILITY_AUDIENCE / CAS_STACK_ID must exactly match
# the values the Gateway signs delegated CAS capabilities with.
[vars]
# Temporary diagnostics: set DOC_MEMORY_PROBE = "1" and redeploy to emit
# structured phase/byte/CAS-in-flight logs. Cloudflare exposes no in-code
# isolate heap counter; use the local probe or DevTools for actual heap sizes.
DOC_CAS_CONCURRENCY = "2"
# Direct uploads still originate in the document DO; keep concurrency bounded
# while production measurements establish the direct-R2 memory profile.
DOC_CAS_DIRECT_UPLOAD = "1"
DOC_CAPABILITY_AUDIENCE = "unidocs-doc:docx"
CAS_CAPABILITY_AUDIENCE = "https://unicas.shazhou.work/stacks/cas_SZ6wfcfqS34J"
CAS_STACK_ID = "cas_SZ6wfcfqS34J"
CAS_STACK_ISSUER = "https://unicas.shazhou.work/oauth/unidocs-cloudflare"
# Issuer + JWKS discovery: the delegated CAS capability is verified against
# the registered stack issuer's live jwks_uri (unknown-kid refresh automatic).
CAS_STACK_JWKS_URI = "https://unicas.shazhou.work/oauth/unidocs-cloudflare/jwks"
CAPABILITY_ALGORITHM = "ES256"
CAPABILITY_TTL_SECONDS = "120"
CAPABILITY_MAX_LIFETIME_SECONDS = "1800"
CAPABILITY_CLOCK_SKEW_SECONDS = "30"

[exports.DocxEditor]
type = "durable-object"
storage = "sqlite"

[exports.DocxOperator]
type = "durable-object"
storage = "sqlite"

# The exports-based declarations register the DO classes; explicit bindings
# make them reachable from this worker's own fetch handler (env.DOCX_EDITOR).
[[durable_objects.bindings]]
name = "DOCX_EDITOR"
class_name = "DocxEditor"

[[durable_objects.bindings]]
name = "DOCX_OPERATOR"
class_name = "DocxOperator"

[[services]]
binding = "CAS_SERVICE"
service = "unidocs-cas"

# Deployment secrets (wrangler secret put, never in this file):
#   CAPABILITY_ISSUER            doc-service identity issuer (== gateway's)
#   CAPABILITY_TRUSTED_JWKS      doc-service identity public JWKS (pinned; the
#                                gateway publishes no jwks_uri for this identity)
#   CAS_STACK_TRUSTED_JWKS       only for non-URL dev issuers; production uses
#                                RFC 8414 discovery from CAS_STACK_ISSUER
