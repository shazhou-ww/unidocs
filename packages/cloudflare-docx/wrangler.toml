name = "unidocs-docx"
main = "dist/worker.js"
compatibility_date = "2025-08-17"

[vars]
INTERNAL_AUTH_MODE = "legacy"
DOC_CAPABILITY_AUDIENCE = "unidocs-doc:docx"
CAS_CAPABILITY_AUDIENCE = "unidocs-cas"
CAPABILITY_ALGORITHM = "ES256"
CAPABILITY_TTL_SECONDS = "120"
CAPABILITY_MAX_LIFETIME_SECONDS = "300"
CAPABILITY_CLOCK_SKEW_SECONDS = "30"

[[durable_objects.bindings]]
name = "DOCX_EDITOR"
class_name = "DocxEditor"

[[durable_objects.bindings]]
name = "DOCX_OPERATOR"
class_name = "DocxOperator"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["DocxEditor", "DocxOperator"]



[[services]]
binding = "CAS_SERVICE"
service = "unidocs-cas"

# Set `SERVICE_ACCESS_KEY` and `CAS_ACCESS_KEY` via wrangler secrets.
# For local dev: uncomment [vars] below
# [vars]
# SERVICE_ACCESS_KEY = "dev-docx-key"
# CAS_ACCESS_KEY = "dev-cas-key"
