name = "unidocs-markdown"
main = "dist/worker.js"
compatibility_date = "2025-08-17"

[[durable_objects.bindings]]
name = "MARKDOWN_EDITOR"
class_name = "MarkdownEditor"

[[durable_objects.bindings]]
name = "MARKDOWN_OPERATOR"
class_name = "MarkdownOperator"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["MarkdownEditor", "MarkdownOperator"]

[[d1_databases]]
binding = "SNAPSHOTS_DB"
database_name = "unidocs-snapshots"
database_id = "d3c78c42-b32f-4a4d-86e4-6cf6341baa8f"
migrations_dir = "../cloudflare-gateway/migrations"

[[r2_buckets]]
bucket_name = "unidocs-cas"
binding = "CAS"

[[services]]
binding = "CAS_SERVICE"
service = "unidocs-cas"

# Internal token for gateway → worker auth
# Set via wrangler secret: `wrangler secret put INTERNAL_TOKEN`
# For local dev: uncomment [vars] below
# [vars]
# INTERNAL_TOKEN = "dev-token"
