name = "unidocs-markdown"
main = "dist/worker.js"
compatibility_date = "2025-08-17"

[vars]
INTERNAL_AUTH_MODE = "legacy"
DOC_CAPABILITY_AUDIENCE = "unidocs-doc:markdown"
CAS_CAPABILITY_AUDIENCE = "unidocs-cas"

[[durable_objects.bindings]]
name = "MARKDOWN_EDITOR"
class_name = "MarkdownEditor"

[[durable_objects.bindings]]
name = "MARKDOWN_OPERATOR"
class_name = "MarkdownOperator"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["MarkdownEditor", "MarkdownOperator"]



[[services]]
binding = "CAS_SERVICE"
service = "unidocs-cas"

# Set both via wrangler secrets:
# `SERVICE_ACCESS_KEY` authenticates Gateway -> Doc.
# `CAS_ACCESS_KEY` authenticates Doc -> CAS.
# For local dev: uncomment [vars] below
# [vars]
# SERVICE_ACCESS_KEY = "dev-markdown-key"
# CAS_ACCESS_KEY = "dev-cas-key"
