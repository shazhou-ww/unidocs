name = "unidocs-gateway"
main = "dist/worker.js"
compatibility_date = "2025-08-17"
workers_dev = false
preview_urls = false

# OAuth issuer metadata stays on the registered issuer origin (unicas.shazhou.work).
[[routes]]
pattern = "unicas.shazhou.work/.well-known/oauth-authorization-server/oauth/unidocs-cloudflare"
zone_name = "shazhou.work"

[[routes]]
pattern = "unicas.shazhou.work/oauth/unidocs-cloudflare/*"
zone_name = "shazhou.work"

# Data plane, webui, and the OAuth authorization surface all live on the app
# domain unidocs.shazhou.work. The issuer claim in tokens stays the registered
# unicas.shazhou.work identifier; only the endpoints are served here too.
# The catch-all covers the bare root, which serves the webui.
[[routes]]
pattern = "unidocs.shazhou.work/*"
zone_name = "shazhou.work"

[[routes]]
pattern = "unidocs.shazhou.work/tenants/*"
zone_name = "shazhou.work"

[[routes]]
pattern = "unidocs.shazhou.work/ui/*"
zone_name = "shazhou.work"

[[routes]]
pattern = "unidocs.shazhou.work/oauth/unidocs-cloudflare/*"
zone_name = "shazhou.work"

# Stack mode: the gateway signs delegated/gateway CAS capabilities with the
# registered unidocs-cloudflare stack key and talks to the canonical middleware
# (unidocs-cas) instead of the legacy shared-key worker.
#
# Production data-plane identity: every /tenants/* request must present a
# Bearer access token (the Gateway-issued OAuth capability JWT) validated
# against GATEWAY_OAUTH_ISSUER and the stack JWKS. The browser OAuth flow
# authenticates through the upstream OIDC provider below; membership rows in
# gateway_oauth_tenant_memberships (D1) authorize tenant access.
[vars]
CAPABILITY_ALGORITHM = "ES256"
CAPABILITY_TTL_SECONDS = "120"
CAPABILITY_MAX_LIFETIME_SECONDS = "1800"
CAPABILITY_CLOCK_SKEW_SECONDS = "30"
CAS_STACK_ID = "cas_SZ6wfcfqS34J"
CAS_STACK_ISSUER = "https://unicas.shazhou.work/oauth/unidocs-cloudflare"
CAS_STACK_KEY_ID = "cf-oauth-2026-09"
CAS_REF_DOMAIN = "doc"
CAS_CAPABILITY_AUDIENCE = "https://unicas.shazhou.work/stacks/cas_SZ6wfcfqS34J"
GATEWAY_OAUTH_ISSUER = "https://unicas.shazhou.work/oauth/unidocs-cloudflare"
GATEWAY_OIDC_ISSUER = "https://accounts.google.com"
GATEWAY_OIDC_REDIRECT_PATH = "/oauth/unidocs-cloudflare/login/callback"
GATEWAY_OIDC_SESSION_TTL_SECONDS = "28800"
# The OAuth/login surface is served on the app domain; the issuer claim keeps
# the registered unicas.shazhou.work identifier.
GATEWAY_PUBLIC_ORIGIN = "https://unidocs.shazhou.work"

[[d1_databases]]
binding = "GATEWAY_DB"
database_name = "unidocs-snapshots"
database_id = "d3c78c42-b32f-4a4d-86e4-6cf6341baa8f"
migrations_dir = "migrations"

[[services]]
binding = "CAS_SERVICE"
service = "unidocs-cas"

[triggers]
crons = ["17 * * * *"]

# Deployment secrets (wrangler secret put, never in this file):
#   DOC_SERVICES_JSON            { docType: { serviceId, url, audience } }
#   CAPABILITY_ISSUER            doc-service identity issuer
#   CAPABILITY_KEY_ID            doc-service identity kid
#   CAPABILITY_PRIVATE_KEY_PKCS8 doc-service identity private key
#   CAS_STACK_PRIVATE_KEY_PKCS8  the registered unidocs-cloudflare stack key
#   GATEWAY_OIDC_CLIENT_ID       upstream OIDC (Google) client id
#   GATEWAY_OIDC_CLIENT_SECRET   upstream OIDC client secret
#   GATEWAY_SESSION_ENCRYPTION_KEY  base64 32-byte key sealing session cookies
#
# Local development only: INSECURE_PATH_IDENTITY=true accepts path identity
# when a request carries no Bearer token. Never set in production.
