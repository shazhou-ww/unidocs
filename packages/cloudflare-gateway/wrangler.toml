name = "unidocs-gateway"
main = "dist/worker.js"
compatibility_date = "2025-08-17"

[vars]
INTERNAL_AUTH_MODE = "legacy"

[[d1_databases]]
binding = "GATEWAY_DB"
database_name = "unidocs-snapshots"
database_id = "d3c78c42-b32f-4a4d-86e4-6cf6341baa8f"
migrations_dir = "migrations"

[[services]]
binding = "CAS_SERVICE"
service = "unidocs-cas"

# Set through deployment secrets/configuration:
# DOC_SERVICES_JSON = { docType: { serviceId, url, accessKey, audience } }
# CAS_ACCESS_KEY = CAS service credential
# Dual/capability mode additionally requires CAPABILITY_PRIVATE_KEY_PKCS8,
# CAPABILITY_KEY_ID, CAPABILITY_ISSUER, and CAS_CAPABILITY_AUDIENCE.
