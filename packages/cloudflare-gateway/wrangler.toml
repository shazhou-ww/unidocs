name = "unidocs-gateway"
main = "dist/worker.js"
compatibility_date = "2025-08-17"
workers_dev = false
preview_urls = false

[[routes]]
pattern = "unicas.shazhou.work/.well-known/oauth-authorization-server/oauth/unidocs-cloudflare"
zone_name = "shazhou.work"

[[routes]]
pattern = "unicas.shazhou.work/oauth/unidocs-cloudflare/*"
zone_name = "shazhou.work"

# Stack mode: the gateway signs delegated/gateway CAS capabilities with the
# registered unidocs-cloudflare stack key and talks to the canonical middleware
# (unidocs-cas) instead of the legacy shared-key worker.
[vars]
CAPABILITY_ALGORITHM = "ES256"
CAPABILITY_TTL_SECONDS = "120"
CAPABILITY_MAX_LIFETIME_SECONDS = "1800"
CAPABILITY_CLOCK_SKEW_SECONDS = "30"
CAS_STACK_ID = "cas_SZ6wfcfqS34J"
CAS_STACK_ISSUER = "https://unicas.shazhou.work/oauth/unidocs-cloudflare"
CAS_STACK_KEY_ID = "cf-oauth-2026-09"
CAS_REF_DOMAIN = "doc"
CAS_CAPABILITY_AUDIENCE = "https://unicas.shazhou.work/stacks/cas_SZ6wfcfqS34J"
GATEWAY_OAUTH_ISSUER = "https://unicas.shazhou.work/oauth/unidocs-cloudflare"

[[d1_databases]]
binding = "GATEWAY_DB"
database_name = "unidocs-snapshots"
database_id = "d3c78c42-b32f-4a4d-86e4-6cf6341baa8f"
migrations_dir = "migrations"

[[services]]
binding = "CAS_SERVICE"
service = "unidocs-cas"

[triggers]
crons = ["17 * * * *"]

# Deployment secrets (wrangler secret put, never in this file):
#   DOC_SERVICES_JSON            { docType: { serviceId, url, accessKey?, audience } }
#   CAPABILITY_ISSUER            doc-service identity issuer
#   CAPABILITY_KEY_ID            doc-service identity kid
#   CAPABILITY_PRIVATE_KEY_PKCS8 doc-service identity private key
#   CAS_STACK_PRIVATE_KEY_PKCS8  the registered unidocs-cloudflare stack key
# Optional standards migration binding (plain var, not a secret):
#   GATEWAY_OAUTH_ISSUER         canonical HTTPS Gateway issuer; must exactly
#                                equal CAS_STACK_ISSUER when enabled
#
# Production identity prerequisite: the gateway's identity resolver is the
# insecure path-identity one (INSECURE_PATH_IDENTITY). Until a real identity/
# auth mechanism is wired for the application stack, the deployed gateway
# rejects every request (401) — do NOT deploy before that lands.
