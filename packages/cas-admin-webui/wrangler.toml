name = "unidocs-cas-admin-webui"
main = "dist/server/index.js"
compatibility_date = "2025-08-17"

# Private Worker: reached only through cas-edge CAS_ADMIN_SERVICE binding.
# No independent public route.

[[d1_databases]]
binding = "CAS_CONTROL_DB"
database_name = "unidocs-cas-control"
database_id = "REPLACE_WITH_CAS_CONTROL_D1_ID"

# Set via wrangler secret / deploy config (never in this file):
#   GOOGLE_OIDC_CLIENT_ID
#   GOOGLE_OIDC_CLIENT_SECRET
#   SESSION_ENCRYPTION_KEYS   JSON map {"kid":"<base64url 32-byte AES key>"}
#
# Optional vars:
#   OIDC_ISSUER (default https://accounts.google.com)
#   OIDC_DISCOVERY_URL (override for tests/local mock provider)
#   SESSION_TTL_MS (default 28800000 = 8h, sliding)
#   SESSION_COOKIE_NAME (default cas_admin_session)
#   SESSION_COOKIE_SECURE (default true; set false for local http dev)
#   CSRF_ENFORCE (default true)
#   CAS_AUDIT_READER_KEY (shared secret for the tenant audit-reader RPC)
#
# Google OAuth consent screen redirect URIs (registered in the Google Cloud
# console):
#   prod:  https://unicas.shazhou.work/admin/auth/callback
#   local: http://localhost:4070/admin/auth/callback
# The BFF builds the redirect URI as PUBLIC_ORIGIN + /admin/auth/callback.
#
# Root Ref audit reads: CAS_TENANT_AUDIT_READER service binding to the tenant
# worker's private /_internal/audit/* RPC (never exposed by cas-edge).

[vars]
CAS_ADMIN_MOUNT = "/admin"
PUBLIC_ORIGIN = "https://unicas.shazhou.work"
