name = "unidocs-psd"
main = "dist/worker.js"
compatibility_date = "2025-08-17"
# 必须在任何 [table] 头之前 —— TOML 里表头之后的所有键都归那张表。此前它写在
# [vars] 内部,于是被解析成一个名叫 compatibility_flags 的 worker 环境变量,
# 而不是兼容性标志: wrangler dry-run 会把它列进绑定表、整份输出里没有任何一
# 行提到 compatibility flags。opentype.js 要 fs,ag-psd 要 fs/path/util/buffer,
# 这个标志就是冲它们加的(aed79e7,2026-08-19),而从那一刻起就没生效过。
# 对照写对的形式: unicas-packages/service-cloudflare/wrangler.toml。
compatibility_flags = ["nodejs_compat"]

# 内置字体的字节要内联进 worker 产物 —— Workers 没有文件系统。
# 同上：必须在任何 [table] 头之前，TOML 里表头之后的所有键都归那张表。写错的
# 表现是 wrangler 把它当成一个环境变量而不是规则，且整份 dry-run 输出里不会有
# 任何一行提到它 —— 与上面 compatibility_flags 那次一模一样的坑。
# 本地栈不读这个文件：同一条规则还要写进 stacks/unidocs-cloudflare/local/runtime.mjs
# 的 esbuild loader（另见 stacks/unidocs-azure/local/runtime.mjs 的冗余保险）。
[[rules]]
type = "Data"
globs = ["**/*.ttf", "**/*.otf"]
fallthrough = true

# Stack mode: the editor DO routes canonical /stacks/{stackId}/tenants/...
# to the middleware worker; the delegated CAS capability is verified against
# the registered stack issuer — either by RFC 8414 discovery of the issuer's
# jwks_uri (HTTPS issuer) or the pinned CAS_STACK_TRUSTED_JWKS snapshot
# (non-URL dev issuers).
[vars]
DOC_CAPABILITY_AUDIENCE = "unidocs-doc:psd"
CAS_CAPABILITY_AUDIENCE = "https://unicas.shazhou.work/stacks/cas_SZ6wfcfqS34J"
CAS_STACK_ID = "cas_SZ6wfcfqS34J"
CAS_STACK_ISSUER = "https://unicas.shazhou.work/oauth/unidocs-cloudflare"
# Issuer + JWKS discovery: the delegated CAS capability is verified against
# the registered stack issuer's live jwks_uri (unknown-kid refresh automatic).
CAS_STACK_JWKS_URI = "https://unicas.shazhou.work/oauth/unidocs-cloudflare/jwks"
CAPABILITY_ALGORITHM = "ES256"
CAPABILITY_TTL_SECONDS = "120"
CAPABILITY_MAX_LIFETIME_SECONDS = "1800"
CAPABILITY_CLOCK_SKEW_SECONDS = "30"
# psd 的字体回退链: 逗号分隔的 postScriptName, 顺序即优先级.
#
# **刻意不在这里列出来**: 不设这个变量时, 接线取 `BUILTIN_FALLBACKS` —— 随包
# 发行的那两套内置字体, 名字从生成的索引里取, 与字节同源. 早先这里写着
# `PSD_FONT_FALLBACKS = ""`, 那在旧语义下与"不设"等价; 新语义下**空串是逃生口**
# (显式要一条空链), 留着它等于把生产 CF 钉死在"一个候选都不试"上 —— 而那正是
# "中文层整层画不出来"的那条路.
#
# 只有想覆盖内置默认时才写它, 值用 scripts/seed-psd-fonts.mjs 回读时打印的名字
# (家族名如 NotoSans 是错的, 要带 -Regular 后缀). 本地 dev 不读这个文件
# (stacks/unidocs-cloudflare/local/doc-types.mjs 按自己那张表装配, 压根不解析
# wrangler.toml): `pnpm dev` 那边同样不设这个变量 —— 它只是把同名的全量版灌进
# 租户索引, 靠"同名覆盖"顶掉内置子集, 覆盖写在 .dev.vars
# (见 .dev.vars.example). Azure 侧对应的是 deploy.mjs 的 --psd-font-fallbacks
# (stacks/unidocs-azure/deploy/service.bicep), 那边空值同样是"不注入这个变量".

[exports.PsdEditor]
type = "durable-object"
storage = "sqlite"

[exports.PsdOperator]
type = "durable-object"
storage = "sqlite"

# 租户级字体索引（其余两个是会话级）。本地 dev 不读这个文件 —— 同一条绑定
# 还要写进 stacks/unidocs-cloudflare/local/doc-types.mjs，只改这里的结果是
# 线上能跑、本地起不来。
[exports.PsdFonts]
type = "durable-object"
storage = "sqlite"

# Exports-based declarations register the DO classes; explicit bindings make
# them reachable from this worker's own fetch handler (env.PSD_EDITOR).
[[durable_objects.bindings]]
name = "PSD_EDITOR"
class_name = "PsdEditor"

[[durable_objects.bindings]]
name = "PSD_OPERATOR"
class_name = "PsdOperator"

[[durable_objects.bindings]]
name = "PSD_FONTS"
class_name = "PsdFonts"

[[services]]
binding = "CAS_SERVICE"
service = "unidocs-cas"

# Deployment secrets (wrangler secret put, never in this file):
#   CAPABILITY_ISSUER            doc-service identity issuer (== gateway's)
#   CAPABILITY_TRUSTED_JWKS      doc-service identity public JWKS (pinned)
#   CAS_STACK_TRUSTED_JWKS       only for non-URL dev issuers; production uses
#                                RFC 8414 discovery from CAS_STACK_ISSUER
