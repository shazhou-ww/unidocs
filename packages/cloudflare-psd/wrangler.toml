name = "unidocs-psd"
main = "dist/worker.js"
compatibility_date = "2025-08-17"

[vars]
INTERNAL_AUTH_MODE = "legacy"
DOC_CAPABILITY_AUDIENCE = "unidocs-doc:psd"
CAS_CAPABILITY_AUDIENCE = "unidocs-cas"
CAPABILITY_ALGORITHM = "ES256"
CAPABILITY_TTL_SECONDS = "120"
CAPABILITY_MAX_LIFETIME_SECONDS = "300"
CAPABILITY_CLOCK_SKEW_SECONDS = "30"
compatibility_flags = ["nodejs_compat"]

[[durable_objects.bindings]]
name = "PSD_EDITOR"
class_name = "PsdEditor"

[[durable_objects.bindings]]
name = "PSD_OPERATOR"
class_name = "PsdOperator"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["PsdEditor", "PsdOperator"]

[[services]]
binding = "CAS_SERVICE"
service = "unidocs-cas"

# Set `SERVICE_ACCESS_KEY` and `CAS_ACCESS_KEY` via wrangler secrets.
# [vars]
# SERVICE_ACCESS_KEY = "dev-psd-key"
# CAS_ACCESS_KEY = "dev-cas-key"
