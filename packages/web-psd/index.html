<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>web-psd — PSD editor demo</title>
    <style>
      :root { color-scheme: light dark; }
      * { box-sizing: border-box; }
      body { margin: 0; font: 14px/1.4 system-ui, sans-serif; }
      header { padding: 12px 16px; border-bottom: 1px solid #8884; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
      header h1 { font-size: 15px; margin: 0; font-weight: 600; }
      header .spacer { flex: 1; }
      main { display: grid; grid-template-columns: 1fr 340px; gap: 0; height: calc(100vh - 54px); }
      #stage { display: flex; align-items: center; justify-content: center; overflow: auto; padding: 24px;
               background: repeating-conic-gradient(#8882 0 25%, transparent 0 50%) 50% / 20px 20px; }
      #view { max-width: 100%; max-height: 100%; box-shadow: 0 2px 12px #0005; image-rendering: pixelated; }
      /* Right column splits into a scrolling layers panel and a chat dock. */
      aside { border-left: 1px solid #8884; display: flex; flex-direction: column; min-height: 0; }
      aside h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; opacity: .6; margin: 0 0 8px; }
      #layers-panel { overflow: auto; padding: 12px; flex: 1 1 40%; min-height: 0; }
      .layer { border: 1px solid #8883; border-radius: 8px; padding: 8px 10px; margin-bottom: 8px; }
      .layer .row { display: flex; align-items: center; gap: 8px; }
      .layer .name { font-weight: 600; flex: 1; }
      .layer .meta { opacity: .6; font-size: 12px; margin-top: 4px; }
      .layer input[type=range] { width: 100%; }
      button, label.file { font: inherit; padding: 6px 10px; border: 1px solid #8886; border-radius: 8px; background: #8881; cursor: pointer; }
      button:disabled { opacity: .5; cursor: default; }
      #status { opacity: .6; font-size: 12px; }

      /* Chat dock: talks directly to the PSD domain agent (Operator). */
      #chat { border-top: 1px solid #8884; display: flex; flex-direction: column; flex: 1 1 60%; min-height: 0; }
      #chat h2 { padding: 12px 12px 0; }
      #chat-log { flex: 1; overflow: auto; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
      .msg { padding: 8px 10px; border-radius: 10px; max-width: 90%; white-space: pre-wrap; word-wrap: break-word; font-size: 13px; }
      .msg.user { align-self: flex-end; background: #4a90d922; border: 1px solid #4a90d955; }
      .msg.agent { align-self: flex-start; background: #8881; border: 1px solid #8883; }
      .msg.err { align-self: flex-start; background: #d9534f22; border: 1px solid #d9534f66; }
      .msg.pending { opacity: .6; font-style: italic; }
      #chat-form { display: flex; gap: 8px; padding: 12px; border-top: 1px solid #8884; }
      #chat-input { flex: 1; font: inherit; padding: 8px 10px; border: 1px solid #8886; border-radius: 8px; background: transparent; color: inherit; resize: none; }
    </style>
  </head>
  <body>
    <header>
      <h1>web-psd</h1>
      <label class="file">Open PSD<input id="file" type="file" accept=".psd" hidden /></label>
      <button id="save">Export PSD</button>
      <span class="spacer"></span>
      <span id="status">loading…</span>
    </header>
    <main>
      <div id="stage"><img id="view" alt="rendered preview" /></div>
      <aside>
        <div id="layers-panel"><h2>Layers</h2><div id="layers"></div></div>
        <div id="chat">
          <h2>Agent</h2>
          <div id="chat-log"></div>
          <form id="chat-form">
            <textarea id="chat-input" rows="2" placeholder="Describe an edit, e.g. “把红色方块调到 50% 透明”"></textarea>
            <button id="chat-send" type="submit">Send</button>
          </form>
        </div>
      </aside>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
