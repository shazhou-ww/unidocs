<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>web-psd — PSD editor demo</title>
    <style>
      :root { color-scheme: light dark; }
      * { box-sizing: border-box; }
      body { margin: 0; font: 14px/1.4 system-ui, sans-serif; }
      header { padding: 12px 16px; border-bottom: 1px solid #8884; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
      header h1 { font-size: 15px; margin: 0; font-weight: 600; }
      header .spacer { flex: 1; }
      main { display: grid; grid-template-columns: 1fr 300px; gap: 0; height: calc(100vh - 54px); }
      #stage { display: flex; align-items: center; justify-content: center; overflow: auto; padding: 24px;
               background: repeating-conic-gradient(#8882 0 25%, transparent 0 50%) 50% / 20px 20px; }
      #view { max-width: 100%; max-height: 100%; box-shadow: 0 2px 12px #0005; image-rendering: pixelated; }
      aside { border-left: 1px solid #8884; overflow: auto; padding: 12px; }
      aside h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; opacity: .6; margin: 0 0 8px; }
      .layer { border: 1px solid #8883; border-radius: 8px; padding: 8px 10px; margin-bottom: 8px; }
      .layer .row { display: flex; align-items: center; gap: 8px; }
      .layer .name { font-weight: 600; flex: 1; }
      .layer .meta { opacity: .6; font-size: 12px; margin-top: 4px; }
      .layer input[type=range] { width: 100%; }
      button, label.file { font: inherit; padding: 6px 10px; border: 1px solid #8886; border-radius: 8px; background: #8881; cursor: pointer; }
      #status { opacity: .6; font-size: 12px; }
    </style>
  </head>
  <body>
    <header>
      <h1>web-psd</h1>
      <label class="file">Open PSD<input id="file" type="file" accept=".psd" hidden /></label>
      <button id="save">Export PSD</button>
      <span class="spacer"></span>
      <span id="status">loading…</span>
    </header>
    <main>
      <div id="stage"><img id="view" alt="rendered preview" /></div>
      <aside><h2>Layers</h2><div id="layers"></div></aside>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
