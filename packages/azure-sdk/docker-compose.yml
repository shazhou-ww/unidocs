services:
  postgres:
    # Alpine variant of the official image: same Postgres, ~100 MB instead of
    # ~670 MB. Safe here because the schema is integer/text only and doesn't
    # depend on collation (where Alpine's musl-based locale support is the
    # usual gotcha).
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: unidocs
      POSTGRES_USER: unidocs
      POSTGRES_PASSWORD: unidocs
    ports:
      - "5433:5432"

# Azurite used to run here as a second container. It doesn't need to: the
# `azurite` npm package ships `azurite-blob` as a plain Node CLI, and this
# repo already runs its other local services (gateway/markdown) as spawned
# `node` processes rather than containers. `stacks/azure/local/runtime.mjs` and
# `packages/azure-sdk/tests/containers.ts` each spawn `azurite-blob` directly
# instead — same `--skipApiVersionCheck` flag, same port 10000, no image to
# pull.
