description: "Create empty document via POST /create"
steps:
  - type: exec
    command: "curl -s -o /dev/null -w '%{http_code}' http://localhost:8787/"
    wait:
      timeout: "60s"
      delay: "2s"
    assert:
      type: jsonata
      expression: "exit_code = 0"
  - type: exec
    command: >-
      curl -s -X POST http://localhost:8787/create
      -H "X-Doc-Id: md-e2e-001"
    assert:
      type: jsonata
      expression: "success = true and version = 1"
