description: "Rollback to v2 restores pre-append content (before Section C was added)"
steps:
  - type: exec
    command: "curl -s -o /dev/null -w '%{http_code}' http://localhost:8787/"
    wait:
      timeout: "60s"
      delay: "2s"
    assert:
      type: jsonata
      expression: "exit_code = 0"
  - type: exec
    command: >-
      curl -s -X POST http://localhost:8787/md-e2e-001/rollback
      -H "Content-Type: application/json"
      -d '{"version":2}'
    assert:
      type: jsonata
      expression: "success = true and version = 5"
