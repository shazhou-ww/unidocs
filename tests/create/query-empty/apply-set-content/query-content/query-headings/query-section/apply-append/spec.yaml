description: "Apply appendSection adds a new section to the document"
steps:
  - type: exec
    command: "curl -s -o /dev/null -w '%{http_code}' http://localhost:8787/"
    wait:
      timeout: "60s"
      delay: "2s"
    assert:
      type: jsonata
      expression: "exit_code = 0"
  - type: exec
    command: >-
      curl -s -X POST http://localhost:8787/md-e2e-001/apply
      -H "Content-Type: application/json"
      -d '{"baseVersion":2,"description":"Add Section C","operations":[{"kind":"appendSection","payload":{"heading":"Section C","content":"Content of C."}}]}'
    assert:
      type: jsonata
      expression: "success = true and version = 3"
