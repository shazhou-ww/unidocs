description: "Rollback to previous version and verify history"
steps:
  - command: "cd /workspace/packages/cloudflare-markdown && nohup pnpm wrangler dev --local --ip 0.0.0.0 --port 8787 > /tmp/wrangler.log 2>&1 &"
    timeout: "5s"
  - command: "curl -s -o /dev/null -w '%{http_code}' http://localhost:8787/"
    wait:
      timeout: "60s"
      delay: "2s"
    assert:
      type: regex
      conditions:
        - { path: "stdout", regex: "^4" }
  - command: "curl -s -X POST http://localhost:8787/create -H 'X-Doc-Id: md-test-004'"
    assert:
      type: jsonata
      expression: "success = true"
  - command: "curl -s -X POST http://localhost:8787/md-test-004/apply -H 'Content-Type: application/json' -d '{\"baseVersion\":1,\"description\":\"v2\",\"operations\":[{\"kind\":\"setContent\",\"payload\":{\"content\":\"# Original\\n\\n## A\\n\\n## B\"}}]}'"
    assert:
      type: jsonata
      expression: "success = true and version = 2"
  - command: "curl -s -X POST http://localhost:8787/md-test-004/apply -H 'Content-Type: application/json' -d '{\"baseVersion\":2,\"description\":\"v3\",\"operations\":[{\"kind\":\"appendSection\",\"payload\":{\"heading\":\"C\",\"content\":\"Content C.\"}}]}'"
    assert:
      type: jsonata
      expression: "success = true and version = 3"
  - command: "curl -s -X POST http://localhost:8787/md-test-004/rollback -H 'Content-Type: application/json' -d '{\"version\":2}'"
    assert:
      type: jsonata
      expression: "success = true and version = 4"
  - command: "curl -s -X POST http://localhost:8787/md-test-004/query -H 'Content-Type: application/json' -d '{\"kind\":\"getContent\"}'"
    assert:
      type: jsonata
      expression: "success = true and version = 4"
  - command: "curl -s http://localhost:8787/md-test-004/history"
    assert:
      type: jsonata
      expression: "success = true and $count(data) = 4"
