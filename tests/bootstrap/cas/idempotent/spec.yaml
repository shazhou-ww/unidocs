sut_type: cli
description: "Leasing the same CAS node twice succeeds without a second content write"
steps:
  - command: "cd /workspace && nohup node scripts/dev.mjs > /tmp/miniflare.log 2>&1 & for i in $(seq 1 30); do sleep 2; GW=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8787/ 2>/dev/null || echo 000); if echo $GW | grep -q '^4'; then echo READY; exit 0; fi; done; echo TIMEOUT; exit 1"
    timeout: "120s"
    assert:
      type: regex
      conditions:
        - { path: "stdout", regex: "READY" }
  - command: "HASH=$(cat /tmp/cas.hash) && curl -s -X POST \"http://localhost:8787/users/test-user-001/cas/nodes/$HASH\" -H 'Content-Type: text/plain' -H 'X-CAS-Lease-Duration: 900000' --data-binary @/tmp/cas.txt"
    assert:
      type: jsonata
      expression: "ready = true"
  - command: "HASH=$(cat /tmp/cas.hash) && curl -s \"http://localhost:8787/users/test-user-001/cas/nodes/$HASH/content\""
    assert:
      type: regex
      conditions:
        - { path: "stdout", regex: "Hello CAS!" }
