sut_type: cli
description: "Lease a parent node with a ready child ref; unknown child is 409"
steps:
  - command: "cd /workspace && nohup node scripts/dev.mjs > /tmp/miniflare.log 2>&1 & for i in $(seq 1 30); do sleep 2; GW=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8787/ 2>/dev/null || echo 000); if echo $GW | grep -q '^4'; then echo READY; exit 0; fi; done; echo TIMEOUT; exit 1"
    timeout: "120s"
    assert:
      type: regex
      conditions:
        - { path: "stdout", regex: "READY" }
  - command: "printf '{\"ref\":\"child\"}' > /tmp/cas-parent.txt && CHILD=$(cat /tmp/cas.hash) && HASH=$(cd /workspace && node scripts/cas-digest.mjs application/json \"$CHILD\" < /tmp/cas-parent.txt) && echo \"$HASH\" > /tmp/cas.parent.hash && curl -s -X POST \"http://localhost:8787/users/test-user-001/cas/nodes/$HASH\" -H 'Content-Type: application/json' -H \"X-CAS-Refs: $CHILD\" --data-binary @/tmp/cas-parent.txt"
    assert:
      type: jsonata
      expression: "ready = true"
  - command: "HASH=$(cat /tmp/cas.parent.hash) && curl -s \"http://localhost:8787/users/test-user-001/cas/nodes/$HASH/metadata\""
    assert:
      type: jsonata
      expression: "$count(metadata.refs) = 1"
  - command: "HASH=$(cat /tmp/cas.hash) && curl -s \"http://localhost:8787/users/test-user-001/cas/nodes/$HASH/metadata\""
    assert:
      type: jsonata
      expression: "state.childRefCount = 1"
  - command: "printf 'orphan parent' > /tmp/cas-orphan.txt && HASH=$(cd /workspace && node scripts/cas-digest.mjs text/plain bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb < /tmp/cas-orphan.txt) && curl -s -o /tmp/cas-noref -w '%{http_code}' -X POST \"http://localhost:8787/users/test-user-001/cas/nodes/$HASH\" -H 'Content-Type: text/plain' -H 'X-CAS-Refs: bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb' --data-binary @/tmp/cas-orphan.txt"
    assert:
      type: regex
      conditions:
        - { path: "stdout", regex: "^409$" }
