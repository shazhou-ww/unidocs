sut_type: cli
description: "Start Miniflare runtime, create markdown document with initial content"
steps:
  - command: "curl -s --compressed -X POST http://localhost:8787/users/test-user-001/docs/markdown/ -H 'X-Doc-Id: md-doc-001'"  # (cloudflare)
    assert:
      type: jsonata
      expression: "success = true"
  - command: "curl -s --compressed -X POST http://localhost:41787/users/test-user-001/docs/markdown/ -H 'X-Doc-Id: md-doc-001'"  # (azure)
    assert:
      type: jsonata
      expression: "success = true"
  - command: "curl -s --compressed -X POST http://localhost:8787/users/test-user-001/docs/markdown/md-doc-001/apply -H 'Content-Type: application/json' -d '{\"baseVersion\":1,\"description\":\"Initial content\",\"operations\":[{\"kind\":\"setContent\",\"payload\":{\"content\":\"# Title\\n\\n## A\\n\\nSection A content.\\n\\n## B\\n\\nSection B content.\"}}]}'"  # (cloudflare)
    assert:
      type: jsonata
      expression: "success = true and version = 2"
  - command: "curl -s --compressed -X POST http://localhost:41787/users/test-user-001/docs/markdown/md-doc-001/apply -H 'Content-Type: application/json' -d '{\"baseVersion\":1,\"description\":\"Initial content\",\"operations\":[{\"kind\":\"setContent\",\"payload\":{\"content\":\"# Title\\n\\n## A\\n\\nSection A content.\\n\\n## B\\n\\nSection B content.\"}}]}'"  # (azure)
    assert:
      type: jsonata
      expression: "success = true and version = 2"
  - command: "curl -s --compressed -X POST http://localhost:8787/users/test-user-001/docs/markdown/md-doc-001/query -H 'Content-Type: application/json' -d '{\"kind\":\"getContent\"}'"  # (cloudflare)
    assert:
      type: jsonata
      expression: "success = true and version = 2 and $contains(data, 'Title')"
  - command: "curl -s --compressed -X POST http://localhost:41787/users/test-user-001/docs/markdown/md-doc-001/query -H 'Content-Type: application/json' -d '{\"kind\":\"getContent\"}'"  # (azure)
    assert:
      type: jsonata
      expression: "success = true and version = 2 and $contains(data, 'Title')"
primary: edit
