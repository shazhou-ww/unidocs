sut_type: cli
description: "Apply multiple deltas: append, replace, delete, verify via queries"
steps:
  - command: "curl -s --compressed -X POST http://localhost:8787/users/test-user-001/docs/markdown/md-doc-001/apply -H 'Content-Type: application/json' -d '{\"baseVersion\":2,\"description\":\"Append C\",\"operations\":[{\"kind\":\"appendSection\",\"payload\":{\"heading\":\"C\",\"content\":\"Section C content.\"}}]}'"  # (cloudflare)
    assert:
      type: jsonata
      expression: "success = true and version = 3"
  - command: "curl -s --compressed -X POST http://localhost:41787/users/test-user-001/docs/markdown/md-doc-001/apply -H 'Content-Type: application/json' -d '{\"baseVersion\":2,\"description\":\"Append C\",\"operations\":[{\"kind\":\"appendSection\",\"payload\":{\"heading\":\"C\",\"content\":\"Section C content.\"}}]}'"  # (azure)
    assert:
      type: jsonata
      expression: "success = true and version = 3"
  - command: "curl -s --compressed -X POST http://localhost:8787/users/test-user-001/docs/markdown/md-doc-001/apply -H 'Content-Type: application/json' -d '{\"baseVersion\":3,\"description\":\"Replace B, delete A\",\"operations\":[{\"kind\":\"replaceSection\",\"payload\":{\"heading\":\"B\",\"content\":\"Updated B.\"}},{\"kind\":\"deleteSection\",\"payload\":{\"heading\":\"A\"}}]}'"  # (cloudflare)
    assert:
      type: jsonata
      expression: "success = true and version = 4"
  - command: "curl -s --compressed -X POST http://localhost:41787/users/test-user-001/docs/markdown/md-doc-001/apply -H 'Content-Type: application/json' -d '{\"baseVersion\":3,\"description\":\"Replace B, delete A\",\"operations\":[{\"kind\":\"replaceSection\",\"payload\":{\"heading\":\"B\",\"content\":\"Updated B.\"}},{\"kind\":\"deleteSection\",\"payload\":{\"heading\":\"A\"}}]}'"  # (azure)
    assert:
      type: jsonata
      expression: "success = true and version = 4"
  - command: "curl -s --compressed -X POST http://localhost:8787/users/test-user-001/docs/markdown/md-doc-001/query -H 'Content-Type: application/json' -d '{\"kind\":\"getHeadings\"}'"  # (cloudflare)
    assert:
      type: jsonata
      expression: "success = true and $count(data) = 3"
  - command: "curl -s --compressed -X POST http://localhost:41787/users/test-user-001/docs/markdown/md-doc-001/query -H 'Content-Type: application/json' -d '{\"kind\":\"getHeadings\"}'"  # (azure)
    assert:
      type: jsonata
      expression: "success = true and $count(data) = 3"
  - command: "curl -s --compressed -X POST http://localhost:8787/users/test-user-001/docs/markdown/md-doc-001/query -H 'Content-Type: application/json' -d '{\"kind\":\"getSection\",\"payload\":{\"heading\":\"B\"}}'"  # (cloudflare)
    assert:
      type: jsonata
      expression: "success = true and $contains(data, 'Updated B')"
  - command: "curl -s --compressed -X POST http://localhost:41787/users/test-user-001/docs/markdown/md-doc-001/query -H 'Content-Type: application/json' -d '{\"kind\":\"getSection\",\"payload\":{\"heading\":\"B\"}}'"  # (azure)
    assert:
      type: jsonata
      expression: "success = true and $contains(data, 'Updated B')"
  - command: "curl -s --compressed -X POST http://localhost:8787/users/test-user-001/docs/markdown/md-doc-001/query -H 'Content-Type: application/json' -d '{\"kind\":\"getContent\"}'"  # (cloudflare)
    assert:
      type: jsonata
      expression: "success = true and version = 4"
  - command: "curl -s --compressed -X POST http://localhost:41787/users/test-user-001/docs/markdown/md-doc-001/query -H 'Content-Type: application/json' -d '{\"kind\":\"getContent\"}'"  # (azure)
    assert:
      type: jsonata
      expression: "success = true and version = 4"
primary: export
branches:
  - conflict
  - clone
  - rollback
