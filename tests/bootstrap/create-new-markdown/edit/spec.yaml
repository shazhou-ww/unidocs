description: "Apply multiple deltas: append, replace, delete, verify via queries"
steps:
  - command: "cd /workspace/packages/cloudflare-markdown && nohup pnpm wrangler dev --inspector-port 9229 --local --ip 0.0.0.0 --port 8788 > /tmp/md.log 2>&1 & cd /workspace/packages/cloudflare-gateway && nohup pnpm wrangler dev --inspector-port 9231 --local --ip 0.0.0.0 --port 8787 > /tmp/gw.log 2>&1 & for i in $(seq 1 30); do sleep 2; MD=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8788/ 2>/dev/null || echo 000); GW=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8787/ 2>/dev/null || echo 000); if echo $MD | grep -q '^4' && echo $GW | grep -q '^4'; then echo READY; exit 0; fi; done; echo TIMEOUT; exit 1"
    timeout: "120s"
    assert:
      type: regex
      conditions:
        - { path: "stdout", regex: "READY" }
  - command: "curl -s --compressed -X POST http://localhost:8787/users/test-user-001/markdown/md-doc-001/apply -H 'Content-Type: application/json' -d '{\"baseVersion\":2,\"description\":\"Append C\",\"operations\":[{\"kind\":\"appendSection\",\"payload\":{\"heading\":\"C\",\"content\":\"Section C content.\"}}]}'"
    assert:
      type: jsonata
      expression: "success = true and version = 3"
  - command: "curl -s --compressed -X POST http://localhost:8787/users/test-user-001/markdown/md-doc-001/apply -H 'Content-Type: application/json' -d '{\"baseVersion\":3,\"description\":\"Replace B, delete A\",\"operations\":[{\"kind\":\"replaceSection\",\"payload\":{\"heading\":\"B\",\"content\":\"Updated B.\"}},{\"kind\":\"deleteSection\",\"payload\":{\"heading\":\"A\"}}]}'"
    assert:
      type: jsonata
      expression: "success = true and version = 4"
  - command: "curl -s --compressed -X POST http://localhost:8787/users/test-user-001/markdown/md-doc-001/query -H 'Content-Type: application/json' -d '{\"kind\":\"getHeadings\"}'"
    assert:
      type: jsonata
      expression: "success = true and $count(data) = 3"
  - command: "curl -s --compressed -X POST http://localhost:8787/users/test-user-001/markdown/md-doc-001/query -H 'Content-Type: application/json' -d '{\"kind\":\"getSection\",\"payload\":{\"heading\":\"B\"}}'"
    assert:
      type: jsonata
      expression: "success = true and $contains(data, 'Updated B')"
  - command: "curl -s --compressed -X POST http://localhost:8787/users/test-user-001/markdown/md-doc-001/query -H 'Content-Type: application/json' -d '{\"kind\":\"getContent\"}'"
    assert:
      type: jsonata
      expression: "success = true and version = 4"
primary: export
branches:
  - conflict
  - clone
  - rollback
