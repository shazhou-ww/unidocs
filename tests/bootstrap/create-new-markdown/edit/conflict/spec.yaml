sut_type: cli
description: "Optimistic lock rejects stale writes, transactional failure rejects partial deltas"
steps:
  - command: "curl -s --compressed -X POST http://localhost:8787/users/test-user-001/docs/markdown/md-doc-001/apply -H 'Content-Type: application/json' -d '{\"baseVersion\":1,\"description\":\"stale write\",\"operations\":[{\"kind\":\"setContent\",\"payload\":{\"content\":\"should fail\"}}]}'"  # (cloudflare)
    assert:
      type: jsonata
      expression: "success = false"
  - command: "curl -s --compressed -X POST http://localhost:41787/users/test-user-001/docs/markdown/md-doc-001/apply -H 'Content-Type: application/json' -d '{\"baseVersion\":1,\"description\":\"stale write\",\"operations\":[{\"kind\":\"setContent\",\"payload\":{\"content\":\"should fail\"}}]}'"  # (azure)
    assert:
      type: jsonata
      expression: "success = false"
  - command: "curl -s --compressed -X POST http://localhost:8787/users/test-user-001/docs/markdown/md-doc-001/apply -H 'Content-Type: application/json' -d '{\"baseVersion\":4,\"description\":\"bad delta\",\"operations\":[{\"kind\":\"replaceSection\",\"payload\":{\"heading\":\"A\",\"content\":\"x\"}},{\"kind\":\"deleteSection\",\"payload\":{\"heading\":\"NonExistent\"}}]}'"  # (cloudflare)
    assert:
      type: jsonata
      expression: "success = false"
  - command: "curl -s --compressed -X POST http://localhost:41787/users/test-user-001/docs/markdown/md-doc-001/apply -H 'Content-Type: application/json' -d '{\"baseVersion\":4,\"description\":\"bad delta\",\"operations\":[{\"kind\":\"replaceSection\",\"payload\":{\"heading\":\"A\",\"content\":\"x\"}},{\"kind\":\"deleteSection\",\"payload\":{\"heading\":\"NonExistent\"}}]}'"  # (azure)
    assert:
      type: jsonata
      expression: "success = false"
  - command: "curl -s --compressed -X POST http://localhost:8787/users/test-user-001/docs/markdown/md-doc-001/query -H 'Content-Type: application/json' -d '{\"kind\":\"getContent\"}'"  # (cloudflare)
    assert:
      type: jsonata
      expression: "success = true and version = 4"

  - command: "curl -s --compressed -X POST http://localhost:41787/users/test-user-001/docs/markdown/md-doc-001/query -H 'Content-Type: application/json' -d '{\"kind\":\"getContent\"}'"  # (azure)
    assert:
      type: jsonata
      expression: "success = true and version = 4"
