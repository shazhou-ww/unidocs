sut_type: cli
description: "Snapshot document and clone via content hash, verify clone has same content"
steps:
  - command: "curl -s --compressed http://localhost:8787/users/test-user-001/docs/markdown/md-doc-001/snapshot"  # (cloudflare)
    assert:
      type: jsonata
      expression: "success = true and hash != ''"
  - command: "curl -s --compressed http://localhost:41787/users/test-user-001/docs/markdown/md-doc-001/snapshot"  # (azure)
    assert:
      type: jsonata
      expression: "success = true and hash != ''"
  - command: "HASH=$(curl -s --compressed http://localhost:8787/users/test-user-001/docs/markdown/md-doc-001/snapshot | node -e 'let d=\"\";process.stdin.on(\"data\",c=>d+=c);process.stdin.on(\"end\",()=>console.log(JSON.parse(d).hash))') && VER=$(curl -s --compressed http://localhost:8787/users/test-user-001/docs/markdown/md-doc-001/snapshot | node -e 'let d=\"\";process.stdin.on(\"data\",c=>d+=c);process.stdin.on(\"end\",()=>console.log(JSON.parse(d).version))') && curl -s --compressed -X POST http://localhost:8787/users/test-user-001/docs/markdown/md-clone-001/init_from_hash -H 'Content-Type: application/json' -d \"{\\\"hash\\\":\\\"$HASH\\\",\\\"sourceVersion\\\":$VER}\""  # (cloudflare)
    assert:
      type: jsonata
      expression: "success = true and docId = 'md-clone-001'"
  - command: "HASH=$(curl -s --compressed http://localhost:41787/users/test-user-001/docs/markdown/md-doc-001/snapshot | node -e 'let d=\"\";process.stdin.on(\"data\",c=>d+=c);process.stdin.on(\"end\",()=>console.log(JSON.parse(d).hash))') && VER=$(curl -s --compressed http://localhost:41787/users/test-user-001/docs/markdown/md-doc-001/snapshot | node -e 'let d=\"\";process.stdin.on(\"data\",c=>d+=c);process.stdin.on(\"end\",()=>console.log(JSON.parse(d).version))') && curl -s --compressed -X POST http://localhost:41787/users/test-user-001/docs/markdown/md-clone-001/init_from_hash -H 'Content-Type: application/json' -d \"{\\\"hash\\\":\\\"$HASH\\\",\\\"sourceVersion\\\":$VER}\""  # (azure)
    assert:
      type: jsonata
      expression: "success = true and docId = 'md-clone-001'"
  - command: "curl -s --compressed -X POST http://localhost:8787/users/test-user-001/docs/markdown/md-clone-001/query -H 'Content-Type: application/json' -d '{\"kind\":\"getContent\"}'"  # (cloudflare)
    assert:
      type: jsonata
      expression: "success = true and version = 1 and $contains(data, 'Updated B')"

  - command: "curl -s --compressed -X POST http://localhost:41787/users/test-user-001/docs/markdown/md-clone-001/query -H 'Content-Type: application/json' -d '{\"kind\":\"getContent\"}'"  # (azure)
    assert:
      type: jsonata
      expression: "success = true and version = 1 and $contains(data, 'Updated B')"
