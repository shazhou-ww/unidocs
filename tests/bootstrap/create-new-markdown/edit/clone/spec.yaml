description: "Snapshot document and clone via content hash, verify clone has same content"
steps:
  - command: "cd /workspace/packages/cloudflare-markdown && nohup pnpm wrangler dev --local --ip 0.0.0.0 --port 8787 > /tmp/wrangler.log 2>&1 &"
    timeout: "5s"
  - command: "curl -s -o /dev/null -w '%{http_code}' http://localhost:8787/"
    wait:
      timeout: "60s"
      delay: "2s"
    assert:
      type: regex
      conditions:
        - { path: "stdout", regex: "^4" }
  - command: "curl -s http://localhost:8787/md-doc-001/snapshot"
    assert:
      type: jsonata
      expression: "success = true and hash != ''"
  - command: "HASH=$(curl -s http://localhost:8787/md-doc-001/snapshot | node -e 'let d=\"\";process.stdin.on(\"data\",c=>d+=c);process.stdin.on(\"end\",()=>console.log(JSON.parse(d).hash))') && VER=$(curl -s http://localhost:8787/md-doc-001/snapshot | node -e 'let d=\"\";process.stdin.on(\"data\",c=>d+=c);process.stdin.on(\"end\",()=>console.log(JSON.parse(d).version))') && curl -s -X POST http://localhost:8787/md-clone-001/init_from_hash -H 'Content-Type: application/json' -d \"{\\\"hash\\\":\\\"$HASH\\\",\\\"sourceVersion\\\":$VER}\""
    assert:
      type: jsonata
      expression: "success = true and docId = 'md-clone-001'"
  - command: "curl -s -X POST http://localhost:8787/md-clone-001/query -H 'Content-Type: application/json' -d '{\"kind\":\"getContent\"}'"
    assert:
      type: jsonata
      expression: "success = true and version = 1 and $contains(data, 'Updated B')"
