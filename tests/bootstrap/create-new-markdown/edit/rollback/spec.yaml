description: "Rollback to v2 and verify content reverts, history grows"
steps:
  - command: "cd /workspace/packages/cloudflare-markdown && nohup pnpm wrangler dev --local --ip 0.0.0.0 --port 8787 > /tmp/wrangler.log 2>&1 &"
    timeout: "5s"
  - command: "curl -s -o /dev/null -w '%{http_code}' http://localhost:8787/"
    wait:
      timeout: "60s"
      delay: "2s"
    assert:
      type: regex
      conditions:
        - { path: "stdout", regex: "^4" }
  - command: "curl -s -X POST http://localhost:8787/md-doc-001/rollback -H 'Content-Type: application/json' -d '{\"version\":2}'"
    assert:
      type: jsonata
      expression: "success = true and version = 5"
  - command: "curl -s -X POST http://localhost:8787/md-doc-001/query -H 'Content-Type: application/json' -d '{\"kind\":\"getContent\"}'"
    assert:
      type: jsonata
      expression: "success = true and version = 5 and $contains(data, 'Section A content')"
  - command: "curl -s http://localhost:8787/md-doc-001/history"
    assert:
      type: jsonata
      expression: "success = true and $count(data) = 5"
