sut_type: cli
description: "Import exported file to create new document, verify content matches"
steps:
  - command: "curl -s --compressed -X POST http://localhost:8787/users/test-user-001/docs/markdown/ -H 'X-Doc-Id: md-imported-001' -F 'file=@/tmp/exported-cf.md'"  # (cloudflare)
    assert:
      type: jsonata
      expression: "success = true"
  - command: "curl -s --compressed -X POST http://localhost:41787/users/test-user-001/docs/markdown/ -H 'X-Doc-Id: md-imported-001' -F 'file=@/tmp/exported-az.md'"  # (azure)
    assert:
      type: jsonata
      expression: "success = true"
  - command: "curl -s --compressed -X POST http://localhost:8787/users/test-user-001/docs/markdown/md-imported-001/query -H 'Content-Type: application/json' -d '{\"kind\":\"getContent\"}'"  # (cloudflare)
    assert:
      type: jsonata
      expression: "success = true and $contains(data, 'Updated B') and $contains(data, 'Section C')"
  - command: "curl -s --compressed -X POST http://localhost:41787/users/test-user-001/docs/markdown/md-imported-001/query -H 'Content-Type: application/json' -d '{\"kind\":\"getContent\"}'"  # (azure)
    assert:
      type: jsonata
      expression: "success = true and $contains(data, 'Updated B') and $contains(data, 'Section C')"
