description: "Export document as markdown file"
steps:
  - command: "cd /workspace && nohup node scripts/dev.mjs > /tmp/miniflare.log 2>&1 & for i in $(seq 1 30); do sleep 2; GW=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8787/ 2>/dev/null || echo 000); if echo $GW | grep -q '^4'; then echo READY; exit 0; fi; done; echo TIMEOUT; exit 1"
    timeout: "120s"
    assert:
      type: regex
      conditions:
        - { path: "stdout", regex: "READY" }
  - command: "curl -s --compressed http://localhost:8787/users/test-user-001/docs/markdown/md-doc-001/export -o /tmp/exported.md"
  - command: "cat /tmp/exported.md"
    assert:
      type: regex
      conditions:
        - { path: "stdout", regex: "Updated B" }
        - { path: "stdout", regex: "Section C" }
primary: import
