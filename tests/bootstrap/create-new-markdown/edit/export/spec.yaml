sut_type: cli
description: "Export document as markdown file"
steps:
  - command: "curl -s --compressed http://localhost:8787/users/test-user-001/docs/markdown/md-doc-001/export -o /tmp/exported-cf.md"  # (cloudflare)
  - command: "curl -s --compressed http://localhost:41787/users/test-user-001/docs/markdown/md-doc-001/export -o /tmp/exported-az.md"  # (azure)
  - command: "cat /tmp/exported-cf.md"  # (cloudflare)
    assert:
      type: regex
      conditions:
        - { path: "stdout", regex: "Updated B" }
        - { path: "stdout", regex: "Section C" }
  - command: "cat /tmp/exported-az.md"  # (azure)
    assert:
      type: regex
      conditions:
        - { path: "stdout", regex: "Updated B" }
        - { path: "stdout", regex: "Section C" }
primary: import
