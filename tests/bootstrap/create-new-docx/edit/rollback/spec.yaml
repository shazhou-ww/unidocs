sut_type: cli
description: "Rollback to v2 and verify content reverts, history grows"
steps:
  - command: "curl -s --compressed -X POST http://localhost:8787/users/test-user-001/docs/docx/docx-doc-001/rollback -H 'Content-Type: application/json' -d '{\"version\":2}'"  # (cloudflare)
    assert:
      type: jsonata
      expression: "success = true and version = 5"
  - command: "curl -s --compressed -X POST http://localhost:41787/users/test-user-001/docs/docx/docx-doc-001/rollback -H 'Content-Type: application/json' -d '{\"version\":2}'"  # (azure)
    assert:
      type: jsonata
      expression: "success = true and version = 5"
  - command: "curl -s --compressed -X POST http://localhost:8787/users/test-user-001/docs/docx/docx-doc-001/query -H 'Content-Type: application/json' -d '{\"kind\":\"getText\"}'"  # (cloudflare)
    assert:
      type: jsonata
      expression: "success = true and version = 5 and $contains(data, 'Hello World') and $contains(data, 'Section A')"
  - command: "curl -s --compressed -X POST http://localhost:41787/users/test-user-001/docs/docx/docx-doc-001/query -H 'Content-Type: application/json' -d '{\"kind\":\"getText\"}'"  # (azure)
    assert:
      type: jsonata
      expression: "success = true and version = 5 and $contains(data, 'Hello World') and $contains(data, 'Section A')"
  - command: "curl -s --compressed http://localhost:8787/users/test-user-001/docs/docx/docx-doc-001/history"  # (cloudflare)
    assert:
      type: jsonata
      expression: "success = true and $count(data) = 5"

  - command: "curl -s --compressed http://localhost:41787/users/test-user-001/docs/docx/docx-doc-001/history"  # (azure)
    assert:
      type: jsonata
      expression: "success = true and $count(data) = 5"
