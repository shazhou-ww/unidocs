description: "Snapshot document and clone via content hash, verify clone has same content"
steps:
  - command: "cd /workspace/packages/cloudflare-docx && nohup pnpm wrangler dev --inspector-port 9230 --local --ip 0.0.0.0 --port 8789 > /tmp/docx.log 2>&1 & cd /workspace/packages/cloudflare-gateway && nohup pnpm wrangler dev --inspector-port 9231 --local --ip 0.0.0.0 --port 8787 > /tmp/gw.log 2>&1 & for i in $(seq 1 30); do sleep 2; DX=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8789/ 2>/dev/null || echo 000); GW=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8787/ 2>/dev/null || echo 000); if echo $DX | grep -q '^4' && echo $GW | grep -q '^4'; then echo READY; exit 0; fi; done; echo TIMEOUT; exit 1"
    timeout: "120s"
    assert:
      type: regex
      conditions:
        - { path: "stdout", regex: "READY" }
  - command: "curl -s --compressed http://localhost:8787/users/test-user-001/docx/docx-doc-001/snapshot"
    assert:
      type: jsonata
      expression: "success = true and hash != ''"
  - command: "HASH=$(curl -s --compressed http://localhost:8787/users/test-user-001/docx/docx-doc-001/snapshot | node -e 'let d=\"\";process.stdin.on(\"data\",c=>d+=c);process.stdin.on(\"end\",()=>console.log(JSON.parse(d).hash))') && VER=$(curl -s --compressed http://localhost:8787/users/test-user-001/docx/docx-doc-001/snapshot | node -e 'let d=\"\";process.stdin.on(\"data\",c=>d+=c);process.stdin.on(\"end\",()=>console.log(JSON.parse(d).version))') && curl -s --compressed -X POST http://localhost:8787/users/test-user-001/docx/docx-clone-001/init_from_hash -H 'Content-Type: application/json' -d \"{\\\"hash\\\":\\\"$HASH\\\",\\\"sourceVersion\\\":$VER}\""
    assert:
      type: jsonata
      expression: "success = true and docId = 'docx-clone-001'"
  - command: "curl -s --compressed -X POST http://localhost:8787/users/test-user-001/docx/docx-clone-001/query -H 'Content-Type: application/json' -d '{\"kind\":\"getText\"}'"
    assert:
      type: jsonata
      expression: "success = true and version = 1 and $contains(data, 'Updated Hello')"
