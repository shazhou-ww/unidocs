sut_type: cli
description: "Upload a 1x1 PNG to CAS, apply insertImage, query getImages"
steps:
  - command: "HASH=$(cd /workspace && node scripts/cas-digest.mjs image/png < /workspace/tests/bootstrap/create-new-docx/edit/image/tiny.png) && echo \"$HASH\" > /tmp/img.hash && curl -s -X POST \"http://localhost:8787/users/test-user-001/cas/nodes/$HASH\" -H 'Content-Type: image/png' -H 'X-CAS-Lease-Duration: 900000' --data-binary @/workspace/tests/bootstrap/create-new-docx/edit/image/tiny.png"  # (cloudflare)
    assert:
      type: jsonata
      expression: "ready = true"
  - command: "HASH=$(cd /workspace && node scripts/cas-digest.mjs image/png < /workspace/tests/bootstrap/create-new-docx/edit/image/tiny.png) && echo \"$HASH\" > /tmp/img.hash && curl -s -X POST \"http://localhost:41787/users/test-user-001/cas/nodes/$HASH\" -H 'Content-Type: image/png' -H 'X-CAS-Lease-Duration: 900000' --data-binary @/workspace/tests/bootstrap/create-new-docx/edit/image/tiny.png"  # (azure) — same content-addressed hash, same underlying CAS worker (transitional casBaseUrl wiring), so this is expected to succeed the same way
    assert:
      type: jsonata
      expression: "ready = true"
  - command: "HASH=$(cat /tmp/img.hash) && curl -s --compressed -X POST http://localhost:8787/users/test-user-001/docs/docx/docx-doc-001/apply -H 'Content-Type: application/json' -d \"{\\\"baseVersion\\\":4,\\\"description\\\":\\\"Insert image\\\",\\\"operations\\\":[{\\\"kind\\\":\\\"insertImage\\\",\\\"payload\\\":{\\\"hash\\\":\\\"$HASH\\\",\\\"widthPx\\\":16,\\\"altText\\\":\\\"dot\\\"}}]}\""  # (cloudflare)
    assert:
      type: jsonata
      expression: "success = true and version = 5"
  - command: "HASH=$(cat /tmp/img.hash) && curl -s --compressed -X POST http://localhost:41787/users/test-user-001/docs/docx/docx-doc-001/apply -H 'Content-Type: application/json' -d \"{\\\"baseVersion\\\":4,\\\"description\\\":\\\"Insert image\\\",\\\"operations\\\":[{\\\"kind\\\":\\\"insertImage\\\",\\\"payload\\\":{\\\"hash\\\":\\\"$HASH\\\",\\\"widthPx\\\":16,\\\"altText\\\":\\\"dot\\\"}}]}\""  # (azure)
    assert:
      type: jsonata
      expression: "success = true and version = 5"
  - command: "curl -s --compressed -X POST http://localhost:8787/users/test-user-001/docs/docx/docx-doc-001/query -H 'Content-Type: application/json' -d '{\"kind\":\"getImages\"}'"  # (cloudflare)
    assert:
      type: jsonata
      expression: "success = true and $count(data) = 1 and data[0].format = 'png' and data[0].altText = 'dot'"
  - command: "curl -s --compressed -X POST http://localhost:41787/users/test-user-001/docs/docx/docx-doc-001/query -H 'Content-Type: application/json' -d '{\"kind\":\"getImages\"}'"  # (azure)
    assert:
      type: jsonata
      expression: "success = true and $count(data) = 1 and data[0].format = 'png' and data[0].altText = 'dot'"
  - command: "curl -s --compressed -o /tmp/docx-export-cf.docx http://localhost:8787/users/test-user-001/docs/docx/docx-doc-001/export && node -e \"const d=require('fs').readFileSync('/tmp/docx-export-cf.docx'); if (d[0]!==0x50||d[1]!==0x4b||d.length===0) process.exit(1); console.log('OK');\""  # (cloudflare)
    assert:
      type: regex
      conditions:
        - { path: "stdout", regex: "OK" }
  - command: "curl -s --compressed -o /tmp/docx-export-az.docx http://localhost:41787/users/test-user-001/docs/docx/docx-doc-001/export && node -e \"const d=require('fs').readFileSync('/tmp/docx-export-az.docx'); if (d[0]!==0x50||d[1]!==0x4b||d.length===0) process.exit(1); console.log('OK');\""  # (azure)
    assert:
      type: regex
      conditions:
        - { path: "stdout", regex: "OK" }
