sut_type: cli
description: "Upload a 1x1 PNG to CAS, apply insertImage, query getImages"
steps:
  - command: "cd /workspace && nohup node scripts/dev.mjs > /tmp/miniflare.log 2>&1 & for i in $(seq 1 30); do sleep 2; GW=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8787/ 2>/dev/null || echo 000); if echo $GW | grep -q '^4'; then echo READY; exit 0; fi; done; echo TIMEOUT; exit 1"
    timeout: "120s"
    assert:
      type: regex
      conditions:
        - { path: "stdout", regex: "READY" }
  - command: "python3 -c \"import pathlib; pathlib.Path('/tmp/tiny.png').write_bytes(bytes([0x89,0x50,0x4e,0x47,0x0d,0x0a,0x1a,0x0a,0x00,0x00,0x00,0x0d,0x49,0x48,0x44,0x52,0x00,0x00,0x00,0x01,0x00,0x00,0x00,0x01,0x08,0x06,0x00,0x00,0x00,0x1f,0x15,0xc4,0x89,0x00,0x00,0x00,0x0a,0x49,0x44,0x41,0x54,0x78,0x9c,0x63,0x00,0x01,0x00,0x00,0x05,0x00,0x01,0x0d,0x0a,0x2d,0xb4,0x00,0x00,0x00,0x00,0x49,0x45,0x4e,0x44,0xae,0x42,0x60,0x82]))\" && HASH=$(cd /workspace && node scripts/cas-digest.mjs image/png < /tmp/tiny.png) && echo \"$HASH\" > /tmp/img.hash && curl -s -X POST \"http://localhost:8787/users/test-user-001/cas/nodes/$HASH\" -H 'Content-Type: image/png' -H 'X-CAS-Lease-Duration: 900000' --data-binary @/tmp/tiny.png"
    assert:
      type: jsonata
      expression: "ready = true"
  - command: "HASH=$(cat /tmp/img.hash) && curl -s --compressed -X POST http://localhost:8787/users/test-user-001/docs/docx/docx-doc-001/apply -H 'Content-Type: application/json' -d \"{\\\"baseVersion\\\":4,\\\"description\\\":\\\"Insert image\\\",\\\"operations\\\":[{\\\"kind\\\":\\\"insertImage\\\",\\\"payload\\\":{\\\"hash\\\":\\\"$HASH\\\",\\\"widthPx\\\":16,\\\"altText\\\":\\\"dot\\\"}}]}\""
    assert:
      type: jsonata
      expression: "success = true and version = 5"
  - command: "curl -s --compressed -X POST http://localhost:8787/users/test-user-001/docs/docx/docx-doc-001/query -H 'Content-Type: application/json' -d '{\"kind\":\"getImages\"}'"
    assert:
      type: jsonata
      expression: "success = true and $count(data) = 1 and data[0].format = 'png' and data[0].altText = 'dot'"
  - command: "curl -s --compressed -o /tmp/docx-export.docx http://localhost:8787/users/test-user-001/docs/docx/docx-doc-001/export && python3 -c \"d=open('/tmp/docx-export.docx','rb').read(); assert d[:2]==b'PK' and len(d)>0; print('OK')\""
    assert:
      type: regex
      conditions:
        - { path: "stdout", regex: "OK" }
