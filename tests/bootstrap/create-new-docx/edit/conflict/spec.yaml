description: "Optimistic lock rejects stale writes, invalid operations fail gracefully"
steps:
  - command: "cd /workspace && nohup node scripts/dev.mjs > /tmp/miniflare.log 2>&1 & for i in $(seq 1 30); do sleep 2; GW=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8787/ 2>/dev/null || echo 000); if echo $GW | grep -q '^4'; then echo READY; exit 0; fi; done; echo TIMEOUT; exit 1"
    timeout: "120s"
    assert:
      type: regex
      conditions:
        - { path: "stdout", regex: "READY" }
  - command: "curl -s --compressed -X POST http://localhost:8787/users/test-user-001/docx/docx-doc-001/apply -H 'Content-Type: application/json' -d '{\"baseVersion\":1,\"description\":\"stale write\",\"operations\":[{\"kind\":\"appendParagraph\",\"payload\":{\"text\":\"should fail\"}}]}'"
    assert:
      type: jsonata
      expression: "success = false"
  - command: "curl -s --compressed -X POST http://localhost:8787/users/test-user-001/docx/docx-doc-001/apply -H 'Content-Type: application/json' -d '{\"baseVersion\":4,\"description\":\"bad operation\",\"operations\":[{\"kind\":\"setRunText\",\"payload\":{\"paragraphIndex\":99,\"runIndex\":0,\"text\":\"x\"}}]}'"
    assert:
      type: jsonata
      expression: "success = false"
  - command: "curl -s --compressed -X POST http://localhost:8787/users/test-user-001/docx/docx-doc-001/query -H 'Content-Type: application/json' -d '{\"kind\":\"getText\"}'"
    assert:
      type: jsonata
      expression: "success = true and version = 4"
