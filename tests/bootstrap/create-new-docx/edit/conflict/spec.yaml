sut_type: cli
description: "Optimistic lock rejects stale writes, invalid operations fail gracefully"
steps:
  - command: "curl -s --compressed -X POST http://localhost:8787/users/test-user-001/docs/docx/docx-doc-001/apply -H 'Content-Type: application/json' -d '{\"baseVersion\":1,\"description\":\"stale write\",\"operations\":[{\"kind\":\"appendParagraph\",\"payload\":{\"text\":\"should fail\"}}]}'"  # (cloudflare)
    assert:
      type: jsonata
      expression: "success = false"
  - command: "curl -s --compressed -X POST http://localhost:41787/users/test-user-001/docs/docx/docx-doc-001/apply -H 'Content-Type: application/json' -d '{\"baseVersion\":1,\"description\":\"stale write\",\"operations\":[{\"kind\":\"appendParagraph\",\"payload\":{\"text\":\"should fail\"}}]}'"  # (azure)
    assert:
      type: jsonata
      expression: "success = false"
  - command: "curl -s --compressed -X POST http://localhost:8787/users/test-user-001/docs/docx/docx-doc-001/apply -H 'Content-Type: application/json' -d '{\"baseVersion\":4,\"description\":\"bad operation\",\"operations\":[{\"kind\":\"setRunText\",\"payload\":{\"paragraphIndex\":99,\"runIndex\":0,\"text\":\"x\"}}]}'"  # (cloudflare)
    assert:
      type: jsonata
      expression: "success = false"
  - command: "curl -s --compressed -X POST http://localhost:41787/users/test-user-001/docs/docx/docx-doc-001/apply -H 'Content-Type: application/json' -d '{\"baseVersion\":4,\"description\":\"bad operation\",\"operations\":[{\"kind\":\"setRunText\",\"payload\":{\"paragraphIndex\":99,\"runIndex\":0,\"text\":\"x\"}}]}'"  # (azure)
    assert:
      type: jsonata
      expression: "success = false"
  - command: "curl -s --compressed -X POST http://localhost:8787/users/test-user-001/docs/docx/docx-doc-001/query -H 'Content-Type: application/json' -d '{\"kind\":\"getText\"}'"  # (cloudflare)
    assert:
      type: jsonata
      expression: "success = true and version = 4"

  - command: "curl -s --compressed -X POST http://localhost:41787/users/test-user-001/docs/docx/docx-doc-001/query -H 'Content-Type: application/json' -d '{\"kind\":\"getText\"}'"  # (azure)
    assert:
      type: jsonata
      expression: "success = true and version = 4"
