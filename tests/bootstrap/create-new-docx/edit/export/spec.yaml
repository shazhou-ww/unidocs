description: "Export DOCX document as binary file"
steps:
  - command: "cd /workspace && nohup node scripts/dev.mjs > /tmp/miniflare.log 2>&1 & for i in $(seq 1 30); do sleep 2; GW=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8787/ 2>/dev/null || echo 000); if echo $GW | grep -q '^4'; then echo READY; exit 0; fi; done; echo TIMEOUT; exit 1"
    timeout: "120s"
    assert:
      type: regex
      conditions:
        - { path: "stdout", regex: "READY" }
  - command: "curl -s --compressed http://localhost:8787/users/test-user-001/docx/docx-doc-001/export -o /tmp/exported.docx"
  - command: "wc -c < /tmp/exported.docx"
    assert:
      type: regex
      conditions:
        - { path: "stdout", regex: "^[0-9]+" }
        - { path: "exit_code", regex: "^0$" }
primary: import
