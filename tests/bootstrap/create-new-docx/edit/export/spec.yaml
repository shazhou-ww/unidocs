sut_type: cli
description: "Export DOCX document as binary file"
steps:
  - command: "curl -s --compressed http://localhost:8787/users/test-user-001/docs/docx/docx-doc-001/export -o /tmp/exported-cf.docx"  # (cloudflare)
  - command: "curl -s --compressed http://localhost:41787/users/test-user-001/docs/docx/docx-doc-001/export -o /tmp/exported-az.docx"  # (azure)
  - command: "wc -c < /tmp/exported-cf.docx"  # (cloudflare)
    assert:
      type: regex
      conditions:
        - { path: "stdout", regex: "^[0-9]+" }
        - { path: "exit_code", regex: "^0$" }
  - command: "wc -c < /tmp/exported-az.docx"  # (azure)
    assert:
      type: regex
      conditions:
        - { path: "stdout", regex: "^[0-9]+" }
        - { path: "exit_code", regex: "^0$" }
primary: import
