sut_type: cli
description: "Import exported DOCX file to create new document, verify content matches"
steps:
  - command: "curl -s --compressed -X POST http://localhost:8787/users/test-user-001/docs/docx/ -H 'X-Doc-Id: docx-imported-001' -F 'file=@/tmp/exported-cf.docx'"  # (cloudflare)
    assert:
      type: jsonata
      expression: "success = true"
  - command: "curl -s --compressed -X POST http://localhost:41787/users/test-user-001/docs/docx/ -H 'X-Doc-Id: docx-imported-001' -F 'file=@/tmp/exported-az.docx'"  # (azure)
    assert:
      type: jsonata
      expression: "success = true"
  - command: "curl -s --compressed -X POST http://localhost:8787/users/test-user-001/docs/docx/docx-imported-001/query -H 'Content-Type: application/json' -d '{\"kind\":\"getText\"}'"  # (cloudflare)
    assert:
      type: jsonata
      expression: "success = true and $contains(data, 'Updated Hello') and $contains(data, 'Content of B')"
  - command: "curl -s --compressed -X POST http://localhost:41787/users/test-user-001/docs/docx/docx-imported-001/query -H 'Content-Type: application/json' -d '{\"kind\":\"getText\"}'"  # (azure)
    assert:
      type: jsonata
      expression: "success = true and $contains(data, 'Updated Hello') and $contains(data, 'Content of B')"
