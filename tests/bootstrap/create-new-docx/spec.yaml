sut_type: cli
description: "Start Miniflare runtime, create DOCX document with initial paragraphs"
steps:
  - command: "curl -s --compressed -X POST http://localhost:8787/users/test-user-001/docs/docx/ -H 'X-Doc-Id: docx-doc-001'"  # (cloudflare)
    assert:
      type: jsonata
      expression: "success = true"
  - command: "curl -s --compressed -X POST http://localhost:41787/users/test-user-001/docs/docx/ -H 'X-Doc-Id: docx-doc-001'"  # (azure)
    assert:
      type: jsonata
      expression: "success = true"
  - command: "curl -s --compressed -X POST http://localhost:8787/users/test-user-001/docs/docx/docx-doc-001/apply -H 'Content-Type: application/json' -d '{\"baseVersion\":1,\"description\":\"Initial content\",\"operations\":[{\"kind\":\"appendParagraph\",\"payload\":{\"text\":\"Hello World\"}},{\"kind\":\"appendParagraph\",\"payload\":{\"text\":\"Section A\",\"options\":{\"style\":\"Heading1\"}}},{\"kind\":\"appendParagraph\",\"payload\":{\"text\":\"Content of A.\"}}]}'"  # (cloudflare)
    assert:
      type: jsonata
      expression: "success = true and version = 2"
  - command: "curl -s --compressed -X POST http://localhost:41787/users/test-user-001/docs/docx/docx-doc-001/apply -H 'Content-Type: application/json' -d '{\"baseVersion\":1,\"description\":\"Initial content\",\"operations\":[{\"kind\":\"appendParagraph\",\"payload\":{\"text\":\"Hello World\"}},{\"kind\":\"appendParagraph\",\"payload\":{\"text\":\"Section A\",\"options\":{\"style\":\"Heading1\"}}},{\"kind\":\"appendParagraph\",\"payload\":{\"text\":\"Content of A.\"}}]}'"  # (azure)
    assert:
      type: jsonata
      expression: "success = true and version = 2"
  - command: "curl -s --compressed -X POST http://localhost:8787/users/test-user-001/docs/docx/docx-doc-001/query -H 'Content-Type: application/json' -d '{\"kind\":\"getText\"}'"  # (cloudflare)
    assert:
      type: jsonata
      expression: "success = true and $contains(data, 'Hello World') and $contains(data, 'Section A')"
  - command: "curl -s --compressed -X POST http://localhost:41787/users/test-user-001/docs/docx/docx-doc-001/query -H 'Content-Type: application/json' -d '{\"kind\":\"getText\"}'"  # (azure)
    assert:
      type: jsonata
      expression: "success = true and $contains(data, 'Hello World') and $contains(data, 'Section A')"
primary: edit
