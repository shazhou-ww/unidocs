sut_type: cli
description: "Lease-with-content rejects digest mismatch and immutable metadata mismatch"
steps:
  - command: "cd /workspace && nohup node scripts/dev.mjs > /tmp/miniflare.log 2>&1 & for i in $(seq 1 30); do sleep 2; GW=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8787/ 2>/dev/null || echo 000); if echo $GW | grep -q '^4'; then echo READY; exit 0; fi; done; echo TIMEOUT; exit 1"
    timeout: "120s"
    assert:
      type: regex
      conditions:
        - { path: "stdout", regex: "READY" }
  - command: "curl -s -o /tmp/cas-digest -w '%{http_code}' -X POST \"http://localhost:8787/users/test-user-001/cas/nodes/aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa\" -H 'Content-Type: text/plain' --data-binary @/tmp/cas.txt"
    assert:
      type: regex
      conditions:
        - { path: "stdout", regex: "^400$" }
  - command: "HASH=$(cat /tmp/cas.hash) && curl -s -o /tmp/cas-meta -w '%{http_code}' -X POST \"http://localhost:8787/users/test-user-001/cas/nodes/$HASH\" -H 'Content-Type: application/json' --data-binary @/tmp/cas.txt"
    assert:
      type: regex
      conditions:
        - { path: "stdout", regex: "^409$" }
