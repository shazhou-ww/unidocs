sut_type: cli
description: "Start Miniflare runtime, create DOCX document with initial paragraphs"
steps:
  # Every stack this file's curls need must be (re-)started here: treespec
  # process state does not carry across spec.yaml boundaries (only the
  # filesystem does — pnpm install/build ran once, in the root
  # tests/treespec/spec.yaml, and that alone survives). This is why every
  # leaf in this tree re-started its own stack before this task, and why
  # every markdown/docx leaf does the same for both stacks now (repeated
  # per file rather than shared, since this tree's spec.yaml format has no
  # include mechanism: a future change to this start block has to be applied
  # to all 15 copies together, not just one — `grep -rn "pg_isready -h
  # 127.0.0.1 -p 5433" tests/treespec` finds every copy before you edit any
  # of them, so none drifts out of sync with the rest).
  # Postgres itself doesn't survive the boundary either (only its on-disk
  # data directory does, via the filesystem-persists guarantee above) — so
  # this also re-does the root bootstrap step's `pg_ctl start`/role/db
  # creation, idempotently: `pg_isready` gates the `pg_ctl start` (skip if
  # already up), and each of the role/db creations is gated by its own
  # `SELECT ... WHERE ...` existence check rather than run unconditionally
  # (a bare repeat of `CREATE USER`/`createdb` fails loudly with "already
  # exists" once a prior leaf has created them on the persisted data
  # directory — verified empirically). The two `nohup`-started stacks are
  # idempotent by construction instead: if a stack is already up, its
  # `nohup` here fails fast on the held port (harmless, backgrounded) and
  # the poll below succeeds immediately against the stack that's already
  # answering.
  - command: "( pg_isready -h 127.0.0.1 -p 5433 -q || su postgres -c \"/usr/lib/postgresql/*/bin/pg_ctl -D /var/lib/postgresql/data -o '-p 5433' -w start\" ) && ( su postgres -c \"psql -p 5433 -tAc \\\"SELECT 1 FROM pg_roles WHERE rolname='unidocs'\\\"\" | grep -q 1 || su postgres -c \"psql -p 5433 -c \\\"CREATE USER unidocs WITH PASSWORD 'unidocs' SUPERUSER\\\"\" ) && ( su postgres -c \"psql -p 5433 -tAc \\\"SELECT 1 FROM pg_database WHERE datname='unidocs'\\\"\" | grep -q 1 || su postgres -c \"createdb -p 5433 -O unidocs unidocs\" ) && ( (cd /workspace && nohup node -e \"import('./stacks/cloudflare/local/runtime.mjs').then(m=>m.startLocalRuntime({docTypes:['markdown','docx'],persistPath:'/workspace/.wrangler/miniflare'}))\" > /tmp/miniflare.log 2>&1) & (cd /workspace && nohup node -e \"import('./stacks/azure/local/runtime.mjs').then(m=>m.startAzureRuntime({docTypes:['markdown','docx'],postgres:'external',casBaseUrl:'http://127.0.0.1:8791',azuriteDataDir:'/workspace/.azure-runtime/azurite-data'}))\" > /tmp/azure.log 2>&1) & for i in $(seq 1 60); do sleep 2; CF=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8787/ 2>/dev/null || echo 000); AZ=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:41787/ 2>/dev/null || echo 000); if echo $CF | grep -q '^4' && echo $AZ | grep -q '^4'; then echo BOTHREADY; exit 0; fi; done; echo TIMEOUT; tail -50 /tmp/miniflare.log /tmp/azure.log; exit 1 )"
