services:
  unicas:
    build:
      context: ../../..
      dockerfile: stacks/unicas/local/Dockerfile
    init: true
    environment:
      UNIDOCS_LOCAL_ARGS_JSON: ${UNIDOCS_LOCAL_ARGS_JSON:-[]}
      UNIDOCS_CAS_ADMIN_ORIGIN: ${UNIDOCS_CAS_ADMIN_ORIGIN:-http://localhost:4070}
      GOOGLE_OIDC_CLIENT_ID: ${GOOGLE_OIDC_CLIENT_ID:-}
      GOOGLE_OIDC_CLIENT_SECRET: ${GOOGLE_OIDC_CLIENT_SECRET:-}
      GOOGLE_OIDC_ISSUER: ${GOOGLE_OIDC_ISSUER:-}
    ports:
      - "4070:4070"
      - "8792:8792"
      - "8793:8793"
      - "8794:8794"
    volumes:
      - unicas-state:/workspace/.wrangler

volumes:
  unicas-state:
