name = "unidocs-cas-server-cloudflare"
main = "dist/worker.js"
compatibility_date = "2025-08-17"
workers_dev = false
preview_urls = false

# Canonical stack-scoped CAS tenant server. Private backing Worker (reached
# through cas-edge CAS_TENANT_SERVICE binding in Task 9). Storage/DO dispatch
# lands in Task 6; the stack-scoped tenant schema is migrated at startup.

[[d1_databases]]
binding = "CAS_CONTROL_DB"
database_name = "unidocs-cas-control"
database_id = "dc8090eb-46bc-43e2-9524-f1554fb71c74"

[[d1_databases]]
binding = "CAS_DB"
database_name = "unidocs-cas-db"
database_id = "66f8738b-b1a9-4727-b468-0c2c73287d2c"

[[r2_buckets]]
binding = "CAS_R2"
bucket_name = "unidocs-cas"
preview_bucket_name = "unidocs-cas-preview"

[durable_objects]
bindings = [
  { name = "CAS_DO", class_name = "CasDurableObject" },
  { name = "CAS_DOMAIN_DO", class_name = "RootRefDomainDurableObject" },
]

[exports.CasDurableObject]
type = "durable-object"
storage = "sqlite"

[exports.RootRefDomainDurableObject]
type = "durable-object"
storage = "sqlite"

# Read-only tenant authority registry: issuer -> stack, keys, refDomains.
# The tenant runtime never mutates control schema; the admin BFF migrates it.

# Secrets (wrangler secret put, never in this file):
#   CAS_AUDIT_READER_KEY   shared secret for the admin BFF -> tenant
#                          /_internal/audit/* RPC (fail closed when absent)

# Static legacy-stack bootstrap (migration window, registry wins; secrets):
