name = "unidocs-cas-control-plane-mcp"
main = "dist/worker.js"
compatibility_date = "2025-08-17"
compatibility_flags = ["global_fetch_strictly_public", "nodejs_compat"]
workers_dev = false
preview_urls = false

# Private Worker: reached only through cas-edge's exact MCP/OAuth route allowlist.
# Secrets: GOOGLE_OIDC_CLIENT_ID, GOOGLE_OIDC_CLIENT_SECRET,
# OAUTH_STATE_ENCRYPTION_KEY (base64url-encoded 32-byte AES key).

[[d1_databases]]
binding = "CAS_CONTROL_DB"
database_name = "unidocs-cas-control"
database_id = "dc8090eb-46bc-43e2-9524-f1554fb71c74"

[[kv_namespaces]]
binding = "OAUTH_KV"
# Replace before deployment; zero is valid for local/dry-run config parsing only.
id = "00000000000000000000000000000000"

[[services]]
binding = "CAS_TENANT_AUDIT_READER"
service = "unidocs-cas-server-cloudflare"

[vars]
PUBLIC_ORIGIN = "https://unicas.shazhou.work"
MCP_ALLOWED_ORIGIN_HOSTNAMES = ""
MCP_MUTATIONS_ENABLED = "false"
# Optional: OIDC_ISSUER, OIDC_DISCOVERY_URL, ADMIN_EMAIL_ALLOWLIST,
# CAS_AUDIT_READER_KEY