  <script>
    const tagOrder = new Map(["Nodes","Root Refs","Operations"].map((name, index) => [name, index]))
    const operationOrder = new Map(["POST /stacks/{stackId}/tenants/{tenantId}/cas/nodes/{hash}/lease","GET /stacks/{stackId}/tenants/{tenantId}/cas/nodes/{hash}/metadata","GET /stacks/{stackId}/tenants/{tenantId}/cas/nodes/{hash}/content","POST /stacks/{stackId}/tenants/{tenantId}/root-refs","GET /stacks/{stackId}/tenants/{tenantId}/root-refs","GET /stacks/{stackId}/tenants/{tenantId}/cas/usage","POST /stacks/{stackId}/tenants/{tenantId}/cas/gc"].map((key, index) => [key, index]))
    Scalar.createApiReference('#app', {
      content: {"info":{"title":"UniCAS Tenant API","version":"0.1.0","description":"Tenant data-plane API for immutable content-addressed nodes, temporary leases, usage accounting, garbage collection, and atomic Root Ref commits.\n\n## Authentication and isolation\n\nEvery request uses a Stack-issued JWT capability in `Authorization: Bearer`. The capability must match the `{stackId}` and `{tenantId}` resource path and grant the operation-specific CAS permission. Root Ref operations additionally use the capability's `refDomain`; it is intentionally not accepted as caller input. A tenant capability is never valid on the `/admin` control plane.\n\n## Node lifecycle\n\nNodes are immutable and identified by the lowercase SHA-256 digest of their canonical bytes. Prepare new state by leasing each required node and completing any returned direct upload. A lease protects uncommitted data from garbage collection but does not make it durable business state.\n\n## Root Ref commit\n\nCommit a prepared DAG by atomically applying all Root Ref deltas with one stable `requestId`. Positive Root Refs are authoritative retained state; negative deltas release old roots. If the response is lost, repeat the identical request. Never generate a new requestId for an uncertain commit.\n\n## Errors and time values\n\nError bodies contain a stable uppercase `error` code and may include a human-readable `message`; clients should branch on the code. All numeric timestamps are Unix milliseconds. Opaque upload identities and pagination cursors must not be parsed or modified."},"tags":[{"name":"Nodes","description":"Read immutable DAG nodes and establish or extend temporary protection leases. Lease readiness and upload instructions describe the prepare phase before a Root Ref commit."},{"name":"Root Refs","description":"Read and atomically update business-root balances in the verified capability's refDomain. Updates are idempotent commit operations, not best-effort counters."},{"name":"Operations","description":"Inspect volatile tenant storage accounting and run race-safe, bounded garbage collection passes."}],"security":[{"tenantCapability":[]}],"components":{"securitySchemes":{"tenantCapability":{"type":"http","scheme":"bearer","bearerFormat":"JWT","description":"Stack-issued JWT capability. Its resource scope must match the path and its permission set must grant the requested CAS operation."}}},"openapi":"3.1.1","paths":{"/stacks/{stackId}/tenants/{tenantId}/cas/nodes/{hash}/content":{"get":{"operationId":"readContent","summary":"Read immutable node content","description":"Streams the canonical bytes for a ready content-addressed node. The path hash is the SHA-256 digest of those bytes; callers should verify the digest after reading. Metadata and mutable lease/reference state are available from the metadata operation. A missing or not-ready node returns `NOT_FOUND`.","tags":["Nodes"],"parameters":[{"name":"stackId","in":"path","required":true,"schema":{"type":"string","minLength":1,"description":"Opaque UniCAS stack identifier that scopes issuer trust and tenant storage."}},{"name":"tenantId","in":"path","required":true,"schema":{"type":"string","minLength":1,"description":"Tenant storage partition within the stack. The capability must authorize this exact tenant."}},{"name":"hash","in":"path","required":true,"schema":{"type":"string","pattern":"^[0-9a-f]{64}$","description":"Lowercase SHA-256 content digest."}}],"responses":{"200":{"description":"OK","content":{}},"400":{"description":"400","content":{"application/json":{"schema":{"type":"object","properties":{"error":{"type":"string","enum":["INVALID_REQUEST"]},"message":{"type":"string"}},"required":["error"]}}}},"401":{"description":"401","content":{"application/json":{"schema":{"type":"object","properties":{"error":{"type":"string","enum":["UNAUTHORIZED"]},"message":{"type":"string"}},"required":["error"]}}}},"403":{"description":"403","content":{"application/json":{"schema":{"type":"object","properti ect","properties":{"metadata":{"type":"object","properties":{"hash":{"type":"string","pattern":"^[0-9a-f]{64}$","description":"Digest that identifies this immutable node."},"size":{"type":"integer","minimum":0,"maximum":9007199254740991,"description":"Logical length of the canonical node content in bytes."},"contentType":{"type":"string","minLength":1,"description":"Media type recorded for the immutable node content."},"refs":{"type":"array","items":{"type":"string","pattern":"^[0-9a-f]{64}$","description":"Lowercase hexadecimal SHA-256 digest of the canonical node bytes. The digest is the immutable node identity within a tenant."},"readOnly":true,"description":"Digests of child nodes referenced by this node. Each occurrence contributes one child reference."}},"required":["hash","size","contentType","refs"],"readOnly":true},"state":{"type":"object","properties":{"leaseStartedAt":{"type":"integer","minimum":0,"maximum":9007199254740991,"description":"Start of the current uninterrupted lease period, or 0 when no lease has existed."},"leaseExpiresAt":{"type":"integer","minimum":0,"maximum":9007199254740991,"description":"Guaranteed protection deadline. Garbage collection cannot delete the node before this time."},"childRefCount":{"type":"integer","minimum":0,"maximum":9007199254740991,"description":"Number of stored parent edges that currently reference this node."},"rootRefCount":{"type":"integer","minimum":-9007199254740991,"maximum":9007199254740991,"description":"Aggregate business Root Ref balance for this node. Positive balances retain committed state."}},"required":["leaseStartedAt","leaseExpiresAt","childRefCount","rootRefCount"],"readOnly":true}},"required":["metadata","state"],"readOnly":true}}}},"400":{"description":"400","content":{"application/json":{"schema":{"type":"object","properties":{"error":{"type":"string","enum":["INVALID_REQUEST"]},"message":{"type":"string"}},"required":["error"]}}}},"401":{"description":"401","content":{"application/json":{"schema":{"type":"object","properties":{"error":{"type":"string","enum":["UNAUTHORIZED"]},"message":{"type":"string"}},"required":["error"]}}}},"403":{"description":"403","content":{"application/json":{"schema":{"type":"object","properties":{"error":{"type":"string","enum":["FORBIDDEN"]},"message":{"type":"string"}},"required":["error"]}}}},"404":{"description":"404","content":{"application/json":{"schema":{"type":"object","properties":{"error":{"type":"string","enum":["NOT_FOUND"]},"message":{"type":"string"}},"required":["error"]}}}},"409":{"description":"409","content":{"application/json":{"schema":{"type":"object","properties":{"error":{"type":"string","enum":["CONFLICT"]},"message":{"type":"string"}},"required":["error"]}}}},"413":{"description":"413","content":{"application/json":{"schema":{"type":"object","properties":{"error":{"type":"string","enum":["PAYLOAD_TOO_LARGE"]},"message":{"type":"string"}},"required":["error"]}}}},"500":{"description":"500","content":{"application/json":{"schema":{"type":"object","properties":{"error":{"type":"string","enum":["INTERNAL_ERROR"]},"message":{"type":"string"}},"required":["error"]}}}}}}},"/stacks/{stackId}/tenants/{tenantId}/cas/nodes/{hash}/lease":{"post":{"operationId":"leaseNode","summary":"Lease or upload a node","description":"Protects a node from garbage collection while a business transaction is preparing a Root Ref commit. If the node is ready, UniCAS extends its lease and returns `ready: true`. Otherwise it reserves the digest and returns `ready: false` with a short-lived direct `PUT` upload request. Send the returned headers exactly, then retry this operation with the upload identity to finalize readiness. The service chooses the actual lease deadline; clients must renew before it expires when work may run longer.","tags":["Nodes"],"parameters":[{"name":"stackId","in":"path","required":true,"schema":{"type":"string","minLength":1,"description":"Opaque UniCAS stack identifier that scopes issuer trust and tenant storage."}},{"name":"tenantId","in":"path","required":true,"schema":{"type":"string","minLength":1,"description":"Tenant storage partition within the stack. The capability must authorize this exact tenant."}},{"name":"hash","in":"path","required":true,"schema":{"type":"string","pattern":"^[0-9a-f]{64}$","description":"Lowercase SHA-256 content digest."}},{"name":"x-cas-lease-duration","in":"header","schema":{"type":"integer","minimum":-9007199254740991,"maximum":9007199254740991,"exclusiveMinimum":0,"description":"Requested lease duration in milliseconds. UniCAS may grant a later deadline."}},{"name":"x-cas-upload-length","in":"header","schema":{"type":"integer","minimum":0,"maximum":9007199254740991,"description":"Expected canonical upload length in bytes when reserving missing content."}},{"name":"x-cas-upload-id","in":"header","schema":{"type":"string","minLength":1,"description":"Opaque upload identity returned by a previous reservation attempt."}},{"name":"content-type","in":"header","schema":{"const":"application/vnd.unidocs.cas-node.v1","description":"Canonical CAS node media type when node bytes are supplied inline."}},{"name":"content-length","in":"header","schema":{"type":"integer","minimum":0,"maximum":9007199254740991,"description":"Exact length of an inline canonical node body."}}],"requestBody":{"required":false,"content":{"application/vnd.unidocs.cas-node.v1":{"schema":{"not":{},"type":"string","contentMediaType":"application/vnd.unidocs.cas-node.v1","contentEncoding":"binary"}}}},"responses":{"200":{"description":"OK","content":{"application/json":{"schema":{"anyOf":[{"type":"object","properties":{"hash":{"type":"string","pattern":"^[0-9a-f]{64}$","description":"Digest of the ready node whose lease is protected."},"ready":{"const":true,"description":"Always true when canonical content is already available."},"leaseStartedAt":{"type":"integer","minimum":0,"maximum":9007199254740991,"description":"Start of the current uninterrupted lease period."},"leaseExpiresAt":{"type":"integer","minimum":0,"maximum":9007199254740991,"description":"Service-selected protection deadline; it may exceed the requested duration."}},"required":["hash","ready","leaseStartedAt","leaseExpiresAt"],"readOnly":true},{"type":"object","properties":{"hash":{"type":"string","pattern":"^[0-9a-f]{64}$","description":"Digest reserved for the pending node upload."},"ready":{"const":false,"description":"Always false while canonical content still needs to be uploaded."},"status":{"const":"upload_required","description":"Indicates that the caller must complete the returned direct upload."},"uploadId":{"type":"string","minLength":1,"description":"Opaque reservation identity used to correlate upload completion."},"expiresAt":{"type":"integer","minimum":0,"maximum":9007199254740991,"description":"Time at which the upload reservation and signed instructions expire."},"upload":{"type":"object","properties":{"method":{"const":"PUT","description":"HTTP method required by the signed upload target."},"url":{"type":"string","format":"uri","description":"Short-lived signed URL for uploading the canonical node bytes."},"headers":{"type":"object","propertyNames":{"type":"string"},"additionalProperties":{"type":"string"},"readOnly":true,"description":"Headers that must be sent exactly as returned when uploading content."}},"required":["method","url","headers"],"readOnly":true,"description":"Direct-upload request that the caller must execute before retrying the lease operation."}},"required":["hash","ready","status","uploadId","expiresAt","upload"],"readOnly":true}]}}}},"400":{"description":"400","content":{"application/json":{"schema":{"type":"object","properties":{"error":{"type":"string","enum":["INVALID_REQUEST"]},"message":{"type":"string"}},"required":["error"]}}}},"401":{"description":"401","content":{"application/json":{"schema":{"type":"object","properties":{"error":{"type":"string","enum":["UNAUTHORIZED"]},"message":{"type":"string"}},"required":["error"]}}}},"403":{"description":"403","content":{"application/json":{"schema":{"type":"object","properties":{"error":{"type":"string","enum":["FORBIDDEN"]},"message":{"type":"string"}},"required":["error"]}}}},"404":{"description":"404","content":{"application/json":{"schema":{"type":"object","properties":{"error":{"type":"string","enum":["NOT_FOUND"]},"message":{"type":"string"}},"required":["error"]}}}},"409":{"description":"409","content":{"application/json":{"schema":{"type":"object","properties":{"error":{"type":"string","enum":["CONFLICT"]},"message":{"type":"string"}},"required":["error"]}}}},"413":{"description":"413","content":{"application/json":{"schema":{"type":"object","properties":{"error":{"type":"string","enum":["PAYLOAD_TOO_LARGE"]},"message":{"type":"string"}},"required":["error"]}}}},"500":{"description":"500","content":{"application/json":{"schema":{"type":"object","properties":{"error":{"type":"string","enum":["INTERNAL_ERROR"]},"message":{"type":"string"}},"required":["error"]}}}}}}},"/stacks/{stackId}/tenants/{tenantId}/cas/usage":{"get":{"operationId":"getUsage","summary":"Read tenant CAS usage","description":"Returns a current operational accounting snapshot for one tenant: metadata rows, logical and stored ready bytes, pending reservations, not-ready nodes, and active leases. Counters are diagnostic and may change immediately as uploads, leases, Root Refs, and garbage collection progress.","tags":["Operations"],"parameters":[{"name":"stackId","in":"path","required":true,"schema":{"type":"string","minLength":1,"description":"Opaque UniCAS stack identifier that scopes issuer trust and tenant storage."}},{"name":"tenantId","in":"path","required":true,"schema":{"type":"string","minLength":1,"description":"Tenant storage partition within the stack. The capability must authorize this exact tenant."}}],"responses":{"200":{"description":"OK","content":{"application/json":{"schema":{"type":"object","properties":{"nodeCount":{"type":"integer","minimum":0,"m ication/json":{"schema":{"type":"object","properties":{"error":{"type":"string","enum":["PAYLOAD_TOO_LARGE"]},"message":{"type":"string"}},"required":["error"]}}}},"500":{"description":"500","content":{"application/json":{"schema":{"type":"object","properties":{"error":{"type":"string","enum":["INTERNAL_ERROR"]},"message":{"type":"string"}},"required":["error"]}}}}}}},"/stacks/{stackId}/tenants/{tenantId}/cas/gc":{"post":{"operationId":"runGc","summary":"Run tenant garbage collection","description":"Runs one bounded garbage-collection pass. A node is eligible only when it has no positive root or child references and its lease has expired. Eligibility is rechecked inside the tenant mutation queue before deletion, closing races with concurrent lease and Root Ref operations. Repeated calls are expected until the desired amount of work has been examined.","tags":["Operations"],"parameters":[{"name":"stackId","in":"path","required":true,"schema":{"type":"string","minLength":1,"description":"Opaque UniCAS stack identifier that scopes issuer trust and tenant storage."}},{"name":"tenantId","in":"path","required":true,"schema":{"type":"string","minLength":1,"description":"Tenant storage partition within the stack. The capability must authorize this exact tenant."}}],"requestBody":{"required":false,"content":{"application/json":{"schema":{"type":"object","properties":{"maxNodes":{"type":"integer","minimum":-9007199254740991,"maximum":9007199254740991,"exclusiveMinimum":0,"description":"Optional upper bound on candidate nodes examined by this pass."}},"readOnly":true}}}},"responses":{"200":{"description":"OK","content":{"application/json":{"schema":{"type":"object","properties":{"examined":{"type":"integer","minimum":0,"maximum":9007199254740991,"description":"Candidate nodes examined during this bounded collection pass."},"deleted":{"type":"integer","minimum":0,"maximum":9007199254740991,"description":"Eligible node records and content objects deleted by this pass."},"reclaim  are opaque and bound to the snapshot and filters.","tags":["Root Refs"],"parameters":[{"name":"stackId","in":"path","required":true,"schema":{"type":"string","minLength":1,"description":"Opaque UniCAS stack identifier that scopes issuer trust and tenant storage."}},{"name":"tenantId","in":"path","required":true,"schema":{"type":"string","minLength":1,"description":"Tenant storage partition within the stack. The capability must authorize this exact tenant."}},{"name":"limit","in":"query","schema":{"type":"integer","minimum":1,"maximum":1000,"description":"Maximum balances to return, from 1 through 1000."},"allowEmptyValue":true,"allowReserved":true},{"name":"cursor","in":"query","schema":{"type":"string","minLength":1,"description":"Opaque `nextCursor` from the preceding page. Do not parse or modify it."},"allowEmptyValue":true,"allowReserved":true}],"responses":{"200":{"description":"OK","content":{"application/json":{"schema":{"type":"object","properties":{"refDomain":{"type":"string","minLength":1,"description":"Business lifecycle namespace taken from the verified capability, never from caller input."},"revision":{"type":"integer","minimum":0,"maximum":9007199254740991,"description":"Stable Root Ref snapshot revision represented by this page."},"items":{"type":"array","items":{"type":"object","properties":{"hash":{"type":"string","pattern":"^[0-9a-f]{64}$","description":"Node whose business Root Ref balance is reported."},"refCount":{"type":"integer","minimum":-9007199254740991,"maximum":9007199254740991,"description":"Current balance in the capability's refDomain."}},"required":["hash","refCount"],"readOnly":true},"readOnly":true,"description":"Root Ref balances in this page."},"nextCursor":{"anyOf":[{"type":"string","minLength":1},{"type":"null"}],"description":"Opaque cursor for the next page, or null when this snapshot is exhausted."}},"required":["refDomain","revision","items","nextCursor"],"readOnly":true}}}},"400":{"description":"400","content":{"applicati
