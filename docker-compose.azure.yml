services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: unidocs
      POSTGRES_USER: unidocs
      POSTGRES_PASSWORD: unidocs
    ports:
      - "5433:5432"

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite
    command: ["azurite-blob", "--blobHost", "0.0.0.0"]
    ports:
      - "10000:10000"
